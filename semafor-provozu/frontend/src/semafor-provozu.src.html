<title>Semafor Provozu</title>
<!--SP_ICON-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* Firemní paleta Hranipex: červená ED1B34, doplňkové 00B140 / E8A500 / 0077C8,
     karty F2F2F2, text 2B2B2B, tlumený 5E5E5E, jemný 9E9E9E. */
  :root{
    --bg:#ffffff; --surface:#f2f2f2; --surface-2:#e8e8e8;
    --border:#e2e2e2; --border-strong:#c9c9c9;
    --text:#2b2b2b; --text-muted:#5e5e5e; --text-faint:#9e9e9e;
    --accent:#ed1b34; --accent-hover:#c8152b; --accent-soft:#fce8eb; --accent-contrast:#ffffff;
    --danger:#ed1b34; --danger-soft:#fce8eb;
    --status-green:#00b140; --status-green-soft:#e2f6ea;
    --status-yellow:#c98c00; --status-yellow-soft:#fdf2da;
    --status-red:#ed1b34; --status-red-soft:#fce8eb;
    --info:#0077c8; --info-soft:#e3f1fa;
    --font-body:'HelveticaNeueLT Pro 45 Lt','Helvetica Neue','Inter',Helvetica,Arial,sans-serif;
    --font-head:'HelveticaNeueLT Pro 65 Md','Helvetica Neue','Inter',Helvetica,Arial,sans-serif;
    --radius-sm:4px; --radius-md:6px; --radius-lg:10px;
    --shadow-md:0 12px 32px rgba(0,0,0,0.18);
    --logo-red:block; --logo-white:none;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141414; --surface:#1f1f1f; --surface-2:#282828; --border:#303030; --border-strong:#454545;
      --text:#f2f2f2; --text-muted:#a8a8a8; --text-faint:#7a7a7a;
      --accent:#ff3b4e; --accent-hover:#ff5c6c; --accent-soft:#3a1418; --danger:#ff3b4e; --danger-soft:#3a1418;
      --status-green:#2fd16b; --status-green-soft:#12301d; --status-yellow:#f0b93b; --status-yellow-soft:#332711;
      --status-red:#ff3b4e; --status-red-soft:#3a1418; --info:#4aa3dd; --info-soft:#12283a;
      --shadow-md:0 14px 34px rgba(0,0,0,0.6); --logo-red:none; --logo-white:block;
    }
  }
  :root[data-theme="dark"]{
    --bg:#141414; --surface:#1f1f1f; --surface-2:#282828; --border:#303030; --border-strong:#454545;
    --text:#f2f2f2; --text-muted:#a8a8a8; --text-faint:#7a7a7a;
    --accent:#ff3b4e; --accent-hover:#ff5c6c; --accent-soft:#3a1418; --danger:#ff3b4e; --danger-soft:#3a1418;
    --status-green:#2fd16b; --status-green-soft:#12301d; --status-yellow:#f0b93b; --status-yellow-soft:#332711;
    --status-red:#ff3b4e; --status-red-soft:#3a1418; --info:#4aa3dd; --info-soft:#12283a;
    --shadow-md:0 14px 34px rgba(0,0,0,0.6); --logo-red:none; --logo-white:block;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--bg); color:var(--text); font-family:var(--font-body); font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; }
  button, input, select, textarea{ font-family:inherit; font-size:inherit; color:inherit; }
  h1,h2,h3,h4{ margin:0; text-wrap:balance; font-family:var(--font-head); font-weight:600; }
  .num{ font-variant-numeric:tabular-nums; letter-spacing:-0.01em; }
  svg.ic{ display:block; flex:none; }
  .app{ min-height:100vh; display:flex; flex-direction:column; }

  /* ---- topbar ---- */
  .topbar{ position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:14px; padding:12px 22px; background:var(--bg); border-bottom:1px solid var(--border); }
  .brand{ display:flex; align-items:center; gap:14px; margin-right:auto; min-width:0; }
  .brand-logo{ height:19px; width:auto; flex:none; }
  .brand-logo.logo-red{ display:var(--logo-red); }
  .brand-logo.logo-white{ display:var(--logo-white); }
  .brand-divider{ width:1px; height:26px; background:var(--border-strong); flex:none; }
  .brand-text h1{ font-size:15px; letter-spacing:.01em; }
  .brand-text p{ margin:0; font-size:11.5px; color:var(--text-muted); }
  .test-tag{ background:var(--accent); color:#fff; border-radius:3px; padding:2px 8px; font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; }
  .me{ display:flex; align-items:center; gap:8px; border:1px solid var(--border); border-radius:999px; padding:4px 12px 4px 5px; background:var(--bg); max-width:280px; }
  .me img{ width:24px; height:24px; border-radius:50%; flex:none; }
  .me .mn{ font-size:12.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .me .mm{ font-size:10.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .conn{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-faint); }
  .conn i{ width:8px; height:8px; border-radius:50%; background:var(--text-faint); display:inline-block; }
  .conn.ok i{ background:var(--status-green); }
  .conn.err i{ background:var(--status-red); }
  .conn.busy i{ background:var(--status-yellow); }

  /* ---- layout ---- */
  .layout{ flex:1; display:flex; min-height:0; }
  .sidebar{ width:238px; flex:none; background:var(--bg); border-right:1px solid var(--border); padding:16px 12px; display:flex; flex-direction:column; gap:18px; }
  .nav-group-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-faint); padding:0 8px; margin-bottom:6px; font-weight:600; }
  .nav-list{ display:flex; flex-direction:column; gap:2px; }
  .nav-item{ display:flex; align-items:center; gap:10px; width:100%; padding:8px 9px 8px 10px; border-radius:var(--radius-sm); border:none; border-left:3px solid transparent; background:transparent; color:var(--text); cursor:pointer; text-align:left; }
  .nav-item:hover{ background:var(--surface); }
  .nav-item.active{ background:var(--surface); border-left-color:var(--accent); font-family:var(--font-head); font-weight:600; }
  .nav-item svg{ color:var(--text-muted); flex:none; }
  .nav-item.active svg{ color:var(--accent); }
  .nav-item .lbl{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav-item.sub{ padding-left:14px; font-size:13px; color:var(--text-muted); }
  .nav-badge{ font-variant-numeric:tabular-nums; font-size:10.5px; font-weight:600; background:var(--status-red-soft); color:var(--status-red); border-radius:999px; padding:1px 7px; flex:none; }
  .nav-badge.neutral{ background:var(--surface-2); color:var(--text-muted); }
  .sidebar-foot{ margin-top:auto; padding:0 8px; font-size:11px; color:var(--text-faint); }
  .nav-more{ border:none; background:none; color:var(--text-faint); font-size:11px; cursor:pointer; padding:4px 8px; text-align:left; }

  .main{ flex:1; min-width:0; overflow-y:auto; padding:22px 26px 60px; }
  .view-header{ display:flex; align-items:flex-start; gap:16px; margin-bottom:18px; flex-wrap:wrap; }
  .view-header .titles h2{ font-size:20px; letter-spacing:-0.01em; }
  .view-header .titles p{ margin:3px 0 0; color:var(--text-muted); font-size:12.5px; }
  .view-actions{ margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

  .btn{ display:inline-flex; align-items:center; gap:6px; padding:7px 12px; border-radius:var(--radius-sm); border:1px solid var(--border-strong); background:var(--bg); cursor:pointer; font-weight:500; font-size:12.5px; color:var(--text); white-space:nowrap; text-decoration:none; }
  .btn:hover{ background:var(--surface); }
  .btn:disabled{ opacity:.5; cursor:default; }
  .btn-primary{ background:var(--accent); border-color:var(--accent); color:var(--accent-contrast); }
  .btn-primary:hover{ background:var(--accent-hover); border-color:var(--accent-hover); }
  .btn-ghost{ border-color:transparent; background:transparent; }
  .btn-ghost:hover{ background:var(--surface); }
  .btn-danger{ border-color:var(--danger); color:var(--danger); background:transparent; }
  .btn-danger:hover{ background:var(--danger-soft); }
  .btn-sm{ padding:4px 8px; font-size:11.5px; }
  .btn-xs{ padding:2px 7px; font-size:11px; }
  .btn-icon{ padding:6px; }
  .btn-ok{ border-color:var(--status-green); color:var(--status-green); }
  .btn-ok:hover{ background:var(--status-green-soft); }

  .search-box{ display:flex; align-items:center; gap:6px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:6px 10px; background:var(--bg); min-width:180px; }
  .search-box svg{ color:var(--text-faint); }
  .search-box input{ border:none; outline:none; background:transparent; width:100%; }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:16px; flex-wrap:wrap; }
  .tab{ padding:8px 4px; margin-bottom:-1px; border:none; background:none; cursor:pointer; color:var(--text-muted); font-weight:500; border-bottom:2px solid transparent; display:flex; align-items:center; gap:6px; }
  .tab.active{ color:var(--text); border-bottom-color:var(--accent); }
  .tab .count{ font-variant-numeric:tabular-nums; font-size:11px; color:var(--text-faint); }

  /* ---- kpi ---- */
  .kpi-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:22px; }
  .kpi-tile{ background:var(--surface); border:none; border-radius:var(--radius-md); padding:13px 15px; display:flex; flex-direction:column; gap:5px; cursor:pointer; border-left:3px solid transparent; }
  .kpi-tile:hover{ background:var(--surface-2); }
  .kpi-tile.active{ border-left-color:var(--accent); }
  .kpi-tile .val{ font-family:var(--font-head); font-variant-numeric:tabular-nums; font-size:28px; font-weight:600; line-height:1; letter-spacing:-0.02em; }
  .kpi-tile .lbl{ font-size:12px; color:var(--text-muted); }
  .kpi-tile.warn .val{ color:var(--status-yellow); }
  .kpi-tile.crit .val{ color:var(--status-red); }
  .kpi-tile.zero .val{ color:var(--text-faint); }

  .section{ margin-bottom:26px; }
  .section-title{ display:flex; align-items:center; gap:8px; margin-bottom:10px; font-family:var(--font-head); font-size:11.5px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:.07em; }
  .section-title.alert{ color:var(--accent); }
  .section-title .cnt{ color:var(--text-faint); font-variant-numeric:tabular-nums; }
  .section-title .spacer{ flex:1; }

  .dept-table{ background:var(--surface); border:none; border-radius:var(--radius-md); overflow:hidden; }
  .dept-row{ display:flex; align-items:center; gap:12px; padding:11px 16px; border-bottom:1px solid var(--bg); cursor:pointer; }
  .dept-row:last-child{ border-bottom:none; }
  .dept-row:hover{ background:var(--surface-2); }
  .dept-icon{ width:28px; height:28px; border-radius:50%; background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:none; }
  .dept-row .dept-name{ font-family:var(--font-head); font-weight:600; width:170px; flex:none; }
  .dept-row .dot-row{ display:flex; gap:16px; align-items:center; width:132px; flex:none; }
  .dot-stat{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); }
  .dot-stat b{ font-family:var(--font-head); font-variant-numeric:tabular-nums; color:var(--text); }
  .dept-row .stat{ font-size:11.5px; color:var(--text-muted); margin-left:auto; }
  .dept-row .stat b{ font-variant-numeric:tabular-nums; color:var(--text); }
  .statusdot{ width:9px; height:9px; border-radius:50%; flex:none; }
  .statusdot.green{ background:var(--status-green); } .statusdot.yellow{ background:var(--status-yellow); } .statusdot.red{ background:var(--status-red); }

  /* ---- attention list ---- */
  .attn-list{ display:flex; flex-direction:column; gap:8px; }
  .attn-item{ display:flex; align-items:center; gap:10px; background:var(--surface); border:none; border-left:3px solid var(--status-red); border-radius:var(--radius-sm); padding:10px 13px; cursor:pointer; }
  .attn-item:hover{ background:var(--surface-2); }
  .attn-item.mid{ border-left-color:var(--status-yellow); }
  .attn-item.low{ border-left-color:var(--text-faint); }
  .attn-item .reason{ font-size:11px; color:var(--text-muted); }
  .attn-item .title{ font-weight:500; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .attn-item .badge{ flex:none; }
  .empty-attn{ color:var(--text-muted); font-size:12.5px; padding:16px; background:var(--surface); border:none; border-radius:var(--radius-md); }

  /* ---- badges / chips ---- */
  .badge{ display:inline-flex; align-items:center; gap:4px; border-radius:3px; padding:2px 7px; font-family:var(--font-head); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; white-space:nowrap; }
  .badge.green{ background:var(--status-green-soft); color:var(--status-green); }
  .badge.yellow{ background:var(--status-yellow-soft); color:var(--status-yellow); }
  .badge.red{ background:var(--status-red-soft); color:var(--status-red); }
  .badge.overdue{ background:var(--status-red-soft); color:var(--status-red); }
  .badge.neutral{ background:var(--surface-2); color:var(--text-muted); }
  .badge.info{ background:var(--info-soft); color:var(--info); }
  .badge.unconf{ background:transparent; color:var(--text-faint); box-shadow:inset 0 0 0 1px var(--border-strong); }
  .badge.wait{ background:var(--status-yellow-soft); color:var(--status-yellow); }
  .badge.ceo{ background:var(--text); color:var(--bg); }
  .chip{ border:1px solid var(--border-strong); border-radius:3px; padding:1px 7px; font-size:10.5px; color:var(--text-muted); white-space:nowrap; }
  .chip.prio-vysoka{ border-color:var(--accent); color:var(--accent); font-weight:600; }
  .chip.cost{ display:inline-flex; align-items:center; gap:4px; border-color:var(--info); color:var(--info); font-variant-numeric:tabular-nums; }
  .chip.cost.over{ border-color:var(--status-red); color:var(--status-red); font-weight:600; }
  .cost-box{ display:flex; flex-wrap:wrap; gap:10px 18px; background:var(--surface); border-radius:var(--radius-sm); padding:8px 11px; font-size:12.5px; }
  .cost-box .ci{ display:flex; flex-direction:column; gap:1px; }
  .cost-box .ci .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint); }
  .cost-box .ci .v{ font-variant-numeric:tabular-nums; font-family:var(--font-head); font-weight:600; }
  .cost-box .ci.over .v{ color:var(--status-red); }
  .cost-box .ci.ok .v{ color:var(--status-green); }
  .ceo-row .cost{ display:block; font-size:11.5px; color:var(--info); font-variant-numeric:tabular-nums; margin-top:2px; }
  .ceo-row .cost.over{ color:var(--status-red); font-weight:600; }
  .chip.prio-stredni{ border-color:var(--border-strong); color:var(--text-muted); }
  .chip.prio-nizka{ border-color:var(--border); color:var(--text-faint); }
  .lc{ font-family:var(--font-head); font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:3px; white-space:nowrap; }
  .lc.planned{ background:var(--info-soft); color:var(--info); }
  .lc.active{ background:var(--surface-2); color:var(--text-muted); }
  .lc.paused{ background:var(--status-yellow-soft); color:var(--status-yellow); }
  .lc.done{ background:var(--status-green-soft); color:var(--status-green); }

  /* ---- banner ---- */
  .banner{ display:flex; align-items:center; gap:10px; background:var(--surface); color:var(--text-muted); border:none; border-left:3px solid var(--info); border-radius:var(--radius-sm); padding:10px 14px; margin-bottom:18px; font-size:12.5px; }
  .banner svg{ color:var(--info); flex:none; }
  .banner span{ flex:1; }
  .banner.warn{ border-left-color:var(--status-yellow); } .banner.warn svg{ color:var(--status-yellow); }
  .banner.err{ border-left-color:var(--status-red); } .banner.err svg{ color:var(--status-red); }

  /* ---- project cards ---- */
  .card-list{ display:flex; flex-direction:column; gap:10px; }
  .project-card{ background:var(--surface); border:none; border-radius:var(--radius-md); padding:15px 17px; cursor:pointer; position:relative; }
  .project-card:hover{ background:var(--surface-2); }
  .project-card.is-done{ opacity:.75; }
  .pc-top{ display:flex; align-items:flex-start; gap:10px; margin-bottom:8px; flex-wrap:wrap; }
  .pc-top .statusdot{ margin-top:6px; }
  .pc-title{ font-family:var(--font-head); font-weight:600; font-size:14.5px; flex:1; min-width:0; }
  .pc-meta{ display:flex; flex-wrap:wrap; gap:8px 16px; font-size:12px; color:var(--text-muted); margin-bottom:8px; }
  .pc-meta .mi{ display:flex; align-items:center; gap:5px; font-variant-numeric:tabular-nums; }
  .pc-meta svg{ color:var(--text-faint); }
  .pc-note{ font-size:12px; color:var(--text-muted); margin:-2px 0 8px; }
  .pc-row{ font-size:12.5px; margin-bottom:4px; display:flex; gap:6px; }
  .pc-row .k{ color:var(--text-faint); flex:none; }
  .pc-blocker{ color:var(--danger); }
  .pc-wait{ color:var(--status-yellow); }
  .pc-tasks{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-muted); margin-top:8px; background:var(--bg); border-radius:4px; padding:5px 9px; cursor:pointer; width:fit-content; }
  .pc-tasks:hover{ background:var(--border); color:var(--text); }
  .pc-tasks svg{ color:var(--text-faint); }
  .milestones-list{ margin-top:9px; padding-top:9px; border-top:1px solid var(--bg); }
  .milestone-row{ display:flex; align-items:center; gap:7px; font-size:12px; padding:2px 0; cursor:pointer; }
  .milestone-row.done{ color:var(--text-faint); text-decoration:line-through; }
  .milestone-row input{ accent-color:var(--accent); cursor:pointer; flex:none; }

  /* ---- projekty: seznam ---- */
  .ptable{ background:var(--surface); border-radius:var(--radius-md); overflow:hidden; }
  .prow{ display:grid; grid-template-columns:10px minmax(180px,2fr) 120px minmax(120px,1.4fr) 92px minmax(140px,1.6fr) 28px; gap:10px; align-items:center; padding:9px 14px; border-bottom:1px solid var(--bg); cursor:pointer; font-size:13px; }
  .prow:hover{ background:var(--surface-2); }
  .prow.head{ font-family:var(--font-head); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); cursor:default; }
  .prow.head:hover{ background:transparent; }
  .prow .pt{ font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .prow .pt small{ display:block; font-size:11px; color:var(--text-faint); font-weight:400; }
  .prow .cell{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text-muted); font-size:12px; }
  .prow .cell.dark{ color:var(--text); }
  .prow .exp{ border:none; background:none; color:var(--text-faint); cursor:pointer; padding:2px; display:flex; }
  .prow-tasks{ background:var(--bg); padding:6px 14px 10px 34px; border-bottom:1px solid var(--surface-2); }
  .ptask{ display:flex; align-items:center; gap:8px; font-size:12.5px; padding:4px 0; cursor:pointer; }
  .ptask:hover .t{ color:var(--accent); }
  .ptask .t{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ptask.done .t{ color:var(--text-faint); text-decoration:line-through; }
  .ptask .d{ font-size:11px; color:var(--text-muted); font-variant-numeric:tabular-nums; flex:none; }

  /* ---- kanban ---- */
  .kanban{ display:flex; gap:14px; overflow-x:auto; padding-bottom:8px; }
  .kanban-col{ flex:1 0 260px; min-width:260px; }
  .kanban-col-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; padding:0 2px; }
  .kanban-col-head .dot{ width:8px; height:8px; border-radius:50%; }
  .kanban-col-head h4{ font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-muted); }
  .kanban-col-head .count{ margin-left:auto; font-variant-numeric:tabular-nums; font-size:11px; color:var(--text-faint); }
  .kanban-drop{ background:var(--surface); border-radius:var(--radius-md); padding:8px; min-height:64px; display:flex; flex-direction:column; gap:8px; border:1px solid transparent; }
  .kanban-drop.drag-over{ border-color:var(--accent); background:var(--accent-soft); }
  .task-card{ background:var(--bg); border:none; border-radius:var(--radius-sm); padding:10px 11px; cursor:grab; position:relative; }
  .task-card.has-risk{ box-shadow:inset 3px 0 0 var(--status-red); }
  .task-card.is-blocked{ box-shadow:inset 3px 0 0 var(--status-yellow); }
  .task-card:active{ cursor:grabbing; }
  .tc-title{ font-weight:500; font-size:13px; margin-bottom:4px; padding-right:44px; }
  .tc-proj{ display:flex; align-items:center; gap:5px; font-size:11px; color:var(--text-muted); background:var(--surface); border-radius:3px; padding:2px 7px; margin-bottom:6px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tc-proj svg{ color:var(--text-faint); flex:none; }

  /* v2.21: rozbalený projekt = jeden blok — kroky mají stromovou linku v barvě semaforu, podbarvení a poslední krok blok uzavře */

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function uid(){ var s=''; while(s.length<20) s+=Math.random().toString(36).slice(2); return s.slice(0,20); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function fmtDate(s){ if(!s) return '—'; var p=s.split('-'); if(p.length!==3) return s; return p[2]+'.'+p[1]+'.'+p[0]; }
  function fmtDT(ms){ if(!ms) return ''; var d=new Date(ms); return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'. '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
  function isOverdue(due){ return !!due && due < todayStr(); }
  function fmtRelative(ts){ if(!ts) return ''; var m=Math.round((Date.now()-ts)/60000); if(m<1) return 'právě teď'; if(m<60) return 'před '+m+' min'; var h=Math.round(m/60); if(h<24) return 'před '+h+' h'; var d=Math.round(h/24); return 'před '+d+' d'; }
  function daysSince(ts){ return ts ? Math.floor((Date.now()-ts)/86400000) : Infinity; }
  var MONTHS=['leden','únor','březen','duben','květen','červen','červenec','srpen','září','říjen','listopad','prosinec'];
  var MONTHS_SHORT=['led','úno','bře','dub','kvě','čvn','čvc','srp','zář','říj','lis','pro'];
  var DOW=['Po','Út','St','Čt','Pá','So','Ne'];
  function parseD(s){ if(!s) return null; var a=s.split('-'); if(a.length!==3) return null; return new Date(+a[0],+a[1]-1,+a[2]); }
  function fmtISO(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function addDays(s,k){ var d=parseD(s); if(!d) return ''; d.setDate(d.getDate()+k); return fmtISO(d); }
  function dayDiff(a,b){ var x=parseD(a), y=parseD(b); if(!x||!y) return 0; return Math.round((y-x)/86400000); }
  function dowMon(s){ var d=parseD(s); if(!d) return 0; return (d.getDay()+6)%7; }
  function addWorkdays(s,k){ var d=s, n=0; while(n<k){ d=addDays(d,1); if(dowMon(d)<5) n++; } return d; }
  function isoWeek(s){ var d=parseD(s); if(!d) return 0; var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+3); var th=d.getTime(); var j4=new Date(d.getFullYear(),0,4); var jd=(j4.getDay()+6)%7; j4.setDate(j4.getDate()-jd+3); return 1+Math.round((th-j4.getTime())/604800000); }
  function fmtCW(s){ var w=isoWeek(s); return w ? 'CW'+String(w).padStart(2,'0') : ''; }
  // ISO rok týdne (na přelomu roku se liší od kalendářního: 29.12.2025 je CW01/2026)
  function isoYear(s){ var d=parseD(s); if(!d) return ''; var day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+3); return String(d.getFullYear()); }
  // týdenní termín = interval Po–Ne; pro zpoždění se počítá neděle toho týdne
  function weekEndOf(s){ return addDays(s, 6-dowMon(s)); }
  // v2.24: přesnost „měsíc“ — pro zpoždění platí poslední den měsíce
  function monthEndOf(s){ var d=parseD(s); if(!d) return s; return fmtISO(new Date(d.getFullYear(), d.getMonth()+1, 0)); }
  function effectiveDue(it){ if(!it||!it.dueDate) return ''; return it.duePrecision==='week' ? weekEndOf(it.dueDate) : it.duePrecision==='month' ? monthEndOf(it.dueDate) : it.dueDate; }
  function isOverdueItem(it){ var d=effectiveDue(it); return !!d && d < todayStr(); }
  // kontrola po termínu: dohodnuté datum kontroly už minulo (nezávisle na termínu dodání)
  function isCheckOverdue(it){ return !!(it && it.nextCheckDate) && it.nextCheckDate < todayStr(); }
  // termín podle přesnosti: den = 12.10.2026, týden = CW41/2026 (ISO rok)
  function fmtDue(it){
    if(!it || !it.dueDate) return it && it.nextCheckDate ? 'kontrola '+fmtDate(it.nextCheckDate) : 'neurčen';
    var s = it.duePrecision==='week' ? fmtCW(it.dueDate)+'/'+isoYear(it.dueDate) : it.duePrecision==='month' ? MONTHS[+it.dueDate.slice(5,7)-1]+' '+it.dueDate.slice(0,4) : fmtDate(it.dueDate);
    return it.dueUnconfirmed ? s+' ?' : s;
  }

  // náklady (nepovinné): 0 = nezadáno
  function numOrZero(v){ var n=parseFloat(String(v==null?'':v).replace(/\s|\u00a0/g,'').replace(',','.')); return isFinite(n)&&n>0?n:0; }
  var CURRENCIES = { CZK:'Kč', EUR:'€' };
  function curOf(v){ return CURRENCIES[v] ? v : 'CZK'; }
  function curSymbol(v){ return CURRENCIES[curOf(v)]; }
  // měna se vede u PROJEKTU; úkol v projektu ji dědí (nemíchá se v jednom součtu), samostatný úkol má vlastní
  function itemCurrency(it, kind){
    if(kind==='project') return curOf(it.costCurrency);
    var pr = it.projectId ? (STATE.projects.find(function(x){ return x.id===it.projectId; })||null) : null;
    return pr ? curOf(pr.costCurrency) : curOf(it.costCurrency);
  }
  function fmtMoney(n, cur){ if(!n) return '—'; return Math.round(n).toLocaleString('cs-CZ').replace(/,/g,' ')+' '+curSymbol(cur); }
  function fmtMoneyShort(n, cur){ if(!n) return '—'; var s = n>=1000000 ? (Math.round(n/100000)/10).toLocaleString('cs-CZ')+' mil.' : n>=10000 ? Math.round(n/1000)+' tis.' : Math.round(n).toLocaleString('cs-CZ').replace(/,/g,' '); return s+' '+curSymbol(cur); }
  function currencySelectHtml(id, val){ return '<select id="'+id+'">'+Object.keys(CURRENCIES).map(function(k){ return '<option value="'+k+'"'+(curOf(val)===k?' selected':'')+'>'+k+' ('+CURRENCIES[k]+')</option>'; }).join('')+'</select>'; }
  // FIREMNÍ KURZ (v2.7) — `settings/finance`, zápis omezený pravidlem úložiště na vlastníka aplikace.
  // Kurz slouží VÝHRADNĚ k součtům napříč měnami (CEO přehled, seznam projektů). Částky u projektů
  // a kroků se nikdy nepřepočítávají a ukládají se v zadané měně; přepočet je vždy odvozený údaj
  // a zobrazuje se s uvedením použitého kurzu. Kurz nenastaven (0) = součty zůstávají oddělené.
  var BASE_CUR = 'CZK';
  var FIN = { rate:0, updatedAt:0, updatedBy:'', updatedById:'', log:[] };
  function rateSet(){ return !!(FIN.rate>0); }
  function toBase(n, cur){ return curOf(cur)===BASE_CUR ? n : n*FIN.rate; }
  // kurz se drží i zobrazuje na 2 desetinná místa — zobrazený a použitý kurz musí být tentýž (V27-03),
  // aby si uživatel součet dokázal přepočítat z čísel na obrazovce
  var RATE_DEC = 2;
  function roundRate(r){ var n=Math.round(numOrZero(r)*Math.pow(10,RATE_DEC))/Math.pow(10,RATE_DEC); return n; }
  function fmtRate(r){ return roundRate(r).toLocaleString('cs-CZ',{minimumFractionDigits:2, maximumFractionDigits:RATE_DEC})+' CZK/EUR'; }
  // součet projektů po měnách + volitelný přepočet do CZK
  function costTotals(projects){
    var by={}, n=0, noActual=0;
    (projects||[]).forEach(function(p){ var c=projectCost(p); if(!c.any) return; n++; if(!c.actual) noActual++; var b=by[c.cur]=by[c.cur]||{plan:0,act:0,n:0}; b.plan+=c.plan; b.act+=c.actual; b.n++; });
    var curs=Object.keys(by).sort(); var conv=null;
    if(curs.length>1 && rateSet()){ conv={plan:0,act:0}; curs.forEach(function(k){ conv.plan+=toBase(by[k].plan,k); conv.act+=toBase(by[k].act,k); }); }
    return { by:by, curs:curs, n:n, noActual:noActual, conv:conv, mixedNoRate:(curs.length>1 && !rateSet()) };
  }
  // hlášky o úplnosti: 0 = nezadáno, ne nulový výdaj
  function completenessNote(t){ return t.noActual ? 'U '+t.noActual+' z '+t.n+' projektů není evidováno žádné čerpání — 0 znamená nezadáno, ne nulový výdaj.' : ''; }
  function costTotalsLine(projects, label){
    var t=costTotals(projects); if(!t.n) return '';
    var parts=t.curs.map(function(k){ return '<b>'+esc(fmtMoney(t.by[k].act,k))+'</b> / '+esc(fmtMoney(t.by[k].plan,k)); });
    var s='<div class="cost-box" id="cost-totals" style="margin-bottom:12px"><div class="ci"><span class="k">'+esc(label||'Náklady ve výběru')+' ('+t.n+' projektů) — evidované čerpání / plán</span><span class="v">'+parts.join(' &nbsp;·&nbsp; ')+'</span></div>';
    if(t.conv) s+='<div class="ci"><span class="k">Orientační součet v CZK při aktuálním firemním kurzu '+esc(fmtRate(FIN.rate))+'</span><span class="v">'+esc(fmtMoney(t.conv.act,BASE_CUR))+' / '+esc(fmtMoney(t.conv.plan,BASE_CUR))+'</span></div>';
    else if(t.mixedNoRate) s+='<div class="ci"><span class="k">Součet napříč měnami</span><span class="v" style="font-weight:400;color:var(--text-muted)">kurz není nastaven — Tým &amp; porada → Firemní kurz</span></div>';
    s+='</div>'+(completenessNote(t)?'<div class="qa-hint" style="margin:-6px 0 12px 0" id="cost-totals-note">'+esc(completenessNote(t))+'</div>':'');
    return s;
  }
  // ROZPOČET PROJEKTU (v2.8, V27-02). Náklady se počítají z VŠECH kroků projektu, i archivovaných —
  // archivace je pracovní viditelnost, ne storno výdaje. Výslovné pravidlo:
  //   • evidované čerpání (costActual) se počítá vždy, i u archivovaného kroku — výdaj nastal,
  //   • plán archivovaného kroku se počítá jen tehdy, byl-li krok DOKONČENÝ; archivovaný nedokončený
  //     krok = zrušený plánovaný výdaj, jeho plán se do součtu nebere.
  // 0 znamená „nezadáno“, ne „nulový výdaj“ — proto se vedle součtu hlásí, u kolika kroků čerpání chybí.
  function projectTasksAll(pid){ return STATE.tasks.filter(function(t){ return t.projectId===pid; }); }

  // zapíše jen změněná pole; vrací promise s { ok, historyOk }
  // patch = hodnoty z formuláře; diff se počítá proti opts.base (co uživatel viděl při
  // otevření), aby se posílala JEN pole, která sám změnil. Pole, kde už živý záznam má

  function saveDoc(col, id, patch, opts){
    opts = opts || {};

    if(MEMBER && cur && (!canEditItem(cur) || ('department' in patch && !deptEditable(patch.department)))) return Promise.reject({ code:'mimo útvaru', message:memberBlockText(cur) });
    var diff = diffFields(opts.base || cur, patch);
    if(opts.base && cur){ Object.keys(diff).forEach(function(k){ if(eqVal(cur[k], diff[k])) delete diff[k]; }); }
    if(!Object.keys(diff).length){
      // nic k zápisu do položky; dodatečné události (např. záznam o řešení kolize) se přesto zapíší
      var extra=(opts.events||[]).concat(opts.event?[opts.event]:[]);
      if(!extra.length && !pendingHistCount(id)) return Promise.resolve({ noop:true, ok:true, historyOk:true });
      return appendHistory(id, extra).then(function(){ return { noop:true, ok:true, historyOk:true }; }, function(e){ return { noop:true, ok:true, historyOk:false, historyError:e }; });
    }
    var b = byInfo();
    // změna podstatného údaje někým jiným než tím, kdo stav potvrdil → potvrzení už neplatí

    if('confirmedAt' in diff && diff.confirmedAt) diff.confirmStale = false;

      });

    var b = byInfo(); var now = Date.now();
    var stamped = (events||[]).map(function(e){ return Object.assign({ id:uid(), at:now, by:b.by, byId:b.byId }, e); });   // e.id (pokud je) má přednost
    // fronta v relaci: další zápis k téže položce začne až po dokončení předchozího (i neúspěšného)
    var prev = HIST_QUEUE[itemId] || Promise.resolve();
    var run = prev.catch(function(){}).then(function(){ return writeHistory(itemId, stamped); });
    HIST_QUEUE[itemId] = run;
    return run;
  }
  // ZÁPIS HISTORIE (V22-01, V23-01/02). Události se v dokumentu drží jako MAPA { id: událost }. Platforma slučuje
  // vnořené objekty rekurzivně a `null` nahradí hodnotu klíče (db.d.ts + ověřeno na TEST úložišti), takže:
  //  - PŘIDÁNÍ události = update({events:{<id>:…}}) bez čtení-a-přepsání; zapisuje JEN svoje klíče, nikdy
  //    archivedChunks ani cizí klíče → souběžné přírůstky ani archivace se navzájem nezničí (V23-01/02).
  //  - ARCHIVACE nepřepisuje dokument: zapíše archivní blok a živé události označí náhrobky (`null`) jedním
  //    update spolu s čítačem archivedChunks. Čítač píše pouze archivace, pod lease a z hodnoty přečtené pod
  //    lease → nemůže klesnout. Náhrobky zůstávají (≈28 B každý; při reálné velikosti události 198–230 B a
  //    stropu dokumentu 256 KiB to vychází na ≈47 archivací, tj. ≈7 000 událostí na položku).
  //  - SET celého dokumentu jen ve dvou případech pod lease: založení dosud neexistující historie a jednorázový
  //    převod staršího dokumentu s polem. Kdo pod lease zjistí, že dokument už je mapa, přejde na update.
  //    Přírůstek na dokument s polem nikdy neběží (rozhoduje se z čerstvého čtení; pod lease se čte znovu).
  //  - Zbytkový limit (bez podmíněného zápisu platformy): dva archivátoři pozastavení mezi kontrolou rozpočtu
  //    a zápisem archivního bloku by mohli zapsat stejné číslo bloku; okno je ms a týká se jen archivace.
  var HIST_BUDGET = Math.floor(HIST_LEASE_MS*0.5);
  function eventsArr(body){ var ev=body&&body.events; if(!ev) return []; if(Array.isArray(ev)) return ev.slice(); return Object.keys(ev).filter(function(k){ return ev[k]; }).map(function(k){ return ev[k]; }).sort(function(a,b){ return (a.at||0)-(b.at||0) || String(a.id).localeCompare(String(b.id)); }); }
  function eventsMap(arr){ var o={}; arr.forEach(function(e){ o[e.id||uid()]=e; }); return o; }
  function liveCount(body){ var ev=body&&body.events; if(!ev) return 0; if(Array.isArray(ev)) return ev.length; return Object.keys(ev).filter(function(k){ return ev[k]; }).length; }
  function writeHistory(itemId, stamped){
    var pend = PENDING_HIST[itemId] || []; var toWrite = pend.concat(stamped);
    if(!toWrite.length) return Promise.resolve();
    var ref = db.collection('history').doc(itemId);
    var holder = lockHolder()+':h';
    var busyTries = 0, staleTries = 0;
    // 1) běžný přírůstek: jen svoje klíče
    function mergeAppend(){ return ref.update({ itemId:itemId, updatedAt:Date.now(), events:eventsMap(toWrite) }); }
    // 2) údržba pod lease: založení / převod pole → mapa / archivace (náhrobky + čítač)
    function withLease(work){
      var t0 = Date.now();
      function fresh(){ return (Date.now()-t0) <= HIST_BUDGET; }
      function restart(why){ staleTries++; if(staleTries > 4) throw { code:'history_timeout', message:'údržbu historie se nepodařilo dokončit včas ('+why+')' }; return withLease(work); }
      return ref.acquire({ holder:holder, ttlMs:HIST_LEASE_MS }).then(function(r){
        if(!r.acquired){ busyTries++; if(busyTries>=HIST_TRIES) throw { code:'history_busy', message:'historii právě upravuje někdo jiný' }; return delay(250+Math.random()*200).then(function(){ return withLease(work); }); }
        return ref.get().then(function(snap){
          if(!fresh()) return restart('pomalé čtení');
          return work(snap.exists ? snap.data() : null, fresh, restart);
        }).then(function(res){ ref.acquire({ holder:holder, ttlMs:1000 }).catch(function(){}); return res; });
      });
    }
    // založení nebo převod; když už je dokument mapa, přejde na přírůstek (druhá relace, která čekala na lease)
    function createOrConvert(){
      return withLease(function(body){
        if(body && !Array.isArray(body.events)) return mergeAppend().then(function(){ return body.archivedChunks||0; });
        var prev = body ? eventsArr(body) : []; var have={}; prev.forEach(function(e){ if(e.id) have[e.id]=1; });
        var next = prev.concat(toWrite.filter(function(e){ return !have[e.id]; }));
        var archived = (body&&body.archivedChunks)||0;
        return ref.set({ itemId:itemId, events:eventsMap(next), archivedChunks:archived, updatedAt:Date.now(), converted:!!body }).then(function(){ return archived; });
      });
    }
    // archivace: nejstarší HIST_CHUNK událostí do bloku n+1, v živém dokumentu náhrobky + čítač; nic jiného se nepřepisuje
    function archiveIfNeeded(){
      return withLease(function(body, fresh, restart){
        if(!body || Array.isArray(body.events)) return body ? (body.archivedChunks||0) : 0;
        var live = eventsArr(body); var archived = body.archivedChunks||0;
        if(live.length <= HIST_MAX) return archived;                    // mezitím to udělal někdo jiný
        var chunk = live.slice(0, HIST_CHUNK), n = archived+1;
        return db.collection('history_archive').doc(itemId+'_'+n).set({ itemId:itemId, chunk:n, events:chunk, archivedAt:Date.now() }).then(function(){
          if(!fresh()) return restart('pomalá archivace');            // blok má pevné id — opakování ho jen přepíše stejným obsahem
          var tomb={}; chunk.forEach(function(e){ tomb[e.id]=null; });
          return ref.update({ events:tomb, archivedChunks:n, updatedAt:Date.now() }).then(function(){ return n; });
        });
      });
    }
    var run = ref.get().then(function(snap){
      var body = snap.exists ? snap.data() : null;
      if(!body || Array.isArray(body.events)) return createOrConvert();
      return mergeAppend().then(function(){
        var after = liveCount(body) + toWrite.length;
        return after > HIST_MAX ? archiveIfNeeded() : (body.archivedChunks||0);
      });
    });
    return run.then(function(archived){
      delete PENDING_HIST[itemId]; updateUnloadGuard();
      var h=STATE.history[itemId]||{events:[]}; var have={}; h.events.forEach(function(e){ if(e.id) have[e.id]=1; });
      STATE.history[itemId] = Object.assign({}, h, { events: h.events.concat(toWrite.filter(function(e){ return !have[e.id]; })), archivedChunks: Math.max(h.archivedChunks||0, archived||0) });
      if(STATE.modal && STATE.modal.data.id===itemId) renderHistoryBox();
    }, function(e){
      var have={}; pend.forEach(function(x){ have[x.id]=1; });
      PENDING_HIST[itemId] = pend.concat(stamped.filter(function(x){ return !have[x.id]; })); updateUnloadGuard();
      if(STATE.modal && STATE.modal.data.id===itemId) renderHistoryBox();
      throw e;
    });
  }
  // PENDING_HIST žije jen v paměti stránky (limit): po obnovení/zavření stránky nezapsané události zmizí.
  // Proto se při odchodu ze stránky s nezapsanou historií zobrazí varování prohlížeče.
  function updateUnloadGuard(){ var n=0; Object.keys(PENDING_HIST).forEach(function(k){ n+=PENDING_HIST[k].length; }); window.onbeforeunload = n ? function(){ return 'Nezapsané záznamy historie ('+n+') se po odchodu ze stránky ztratí.'; } : null; }
  // opakování nezapsané historie bez nové události
  function retryHistory(itemId){ return appendHistory(itemId, []); }
  // archiv: každý blok zvlášť — načtený / prázdný / NENAČTENÝ (chyba); neúplný archiv se nikdy nevydává za úplný (V22-03)
  function loadHistoryArchive(itemId){
    var h=STATE.history[itemId]; if(!db||!h||!h.archivedChunks) return Promise.resolve([]);
    h.archiveBlocks = h.archiveBlocks || {};   // n -> { events } | { error }
    var todo=[]; for(var i=1;i<=h.archivedChunks;i++){ if(!h.archiveBlocks[i] || h.archiveBlocks[i].error || h.archiveBlocks[i].missing) todo.push(i); }
    return Promise.all(todo.map(function(n){ return db.collection('history_archive').doc(itemId+'_'+n).get().then(function(sn){ h.archiveBlocks[n] = { events: sn.exists ? (sn.data().events||[]) : [], missing: !sn.exists }; }, function(e){ h.archiveBlocks[n] = { error: e }; }); }))
      .then(function(){
        var all=[], failed=[], missing=[], have={};
        for(var i=1;i<=h.archivedChunks;i++){ var bl=h.archiveBlocks[i]; if(!bl || bl.error){ failed.push(i); continue; } if(bl.missing){ missing.push(i); continue; } bl.events.forEach(function(e){ if(e.id && have[e.id]) return; if(e.id) have[e.id]=1; all.push(e); }); }
        h.archive=all; h.archiveFailed=failed; h.archiveMissing=missing; h.archiveLoaded = failed.length===0 && missing.length===0; h.archiveTried=true;
        return all;
      });
  }
  function loadHistory(itemId){
    if(!db) return Promise.resolve([]);
    return db.collection('history').doc(itemId).get().then(function(snap){
      var ev = snap.exists ? eventsArr(snap.data()) : [];
      var old=STATE.history[itemId]||{}; STATE.history[itemId] = { events: ev, archivedChunks: snap.exists ? (snap.data().archivedChunks||0) : 0, archive: old.archive, archiveLoaded: old.archiveLoaded };
      return ev;
    }).catch(function(){ var o=STATE.history[itemId]||{events:[],archivedChunks:0}; o.loadError=true; STATE.history[itemId]=o; return []; });   // V229-03: chyba čtení není „žádná historie“
  }

  // kooperativní zámek na otevřený detail (db.acquire). Není to bezpečnostní hranice —
  // brání souběžné editaci jen mezi instancemi této aplikace.
  var LOCK_TTL = 90000, lockTimer = null;
  function lockHolder(){ return (ME.id||'anon')+':'+SESSION_ID; }
  var SESSION_ID = uid();
  function acquireLock(col, id){
    if(!db || !id) return Promise.resolve({ acquired:true });
    // selhání acquire se NEPŘEVÁDÍ na „odemčeno“ — formulář zůstane použitelný, ale s upozorněním (V2-12)
    return db.collection(col).doc(id).acquire({ holder:lockHolder(), ttlMs:LOCK_TTL }).then(function(r){ return r; }).catch(function(e){ return { acquired:false, unknown:true, error:e }; });
  }
  function startLockRenew(col, id){
    stopLockRenew();
    lockTimer = setInterval(function(){
      if(!STATE.modal || STATE.modal.data.id!==id) return stopLockRenew();
      acquireLock(col, id).then(function(r){
        if(STATE.modal && STATE.modal.data.id===id){ STATE.modal.lock = r; renderLockBar(); }
      });
    }, LOCK_TTL/2);
  }
  function stopLockRenew(){ if(lockTimer){ clearInterval(lockTimer); lockTimer=null; } }
  // platforma nemá „release“: zámek se při zavření detailu zkrátí novým acquire se stejným
  // držitelem na minimální TTL (1 s), aby další člověk nečekal až 90 s
  function releaseLock(m){ if(!db||!m||!m.lock||!m.lock.acquired||!m.data.id) return; var col=m.type==='project'?'projects':'tasks'; db.collection(col).doc(m.data.id).acquire({ holder:lockHolder(), ttlMs:1000 }).catch(function(){}); }

  // ---------------------------------------------------------------------
  // odvozené pomocníky
  // ---------------------------------------------------------------------
  function liveProjects(){ return STATE.projects.filter(function(p){ return !p.archived; }); }
  function liveTasks(){ return STATE.tasks.filter(function(t){ return !t.archived; }); }
  function openProjects(){ return liveProjects().filter(function(p){ return p.lifecycle!=='done'; }); }
  function projectsFor(dk){ return liveProjects().filter(function(p){ return p.department===dk; }); }
  function tasksFor(dk){ return liveTasks().filter(function(t){ return t.department===dk; }); }
  function projectOf(t){ return t && t.projectId ? (STATE.projects.find(function(p){ return p.id===t.projectId; })||null) : null; }
  function tasksOfProject(pid){ return liveTasks().filter(function(t){ return t.projectId===pid; }); }
  function matchesSearch(text, q){ if(!q) return true; return String(text||'').toLowerCase().indexOf(q.toLowerCase())!==-1; }
  function inboxTasks(){ return liveTasks().filter(function(t){ return !t.department && t.status!=='done'; }).sort(function(a,b){ return (a.createdAt||0)-(b.createdAt||0); }); }

  // potvrzení stavu: čerstvé / staré / žádné
  // potvrzení: kdo, kdy a k jaké verzi. „Potvrdil vlastník“ se tvrdí jen když potvrzující
  // je skutečně vlastník položky (V2-07). Změna podstatného pole po potvrzení = 'changed'.
  function confirmState(it){
    if(!it.confirmedAt) return 'none';
    if(it.confirmStale) return 'changed';
    return daysSince(it.confirmedAt) > STALE_DAYS ? 'stale' : 'fresh';
  }
  function confirmerIsOwner(it){ return !!it.confirmedAt && ((it.confirmedById && it.confirmedById===it.ownerUserId) || (it.confirmedBy && normKey(it.confirmedBy)===ownerKey(it))); }
  function confirmWho(it){ var who=(it.confirmedById&&PEOPLE[it.confirmedById]?authorLabel(it.confirmedBy,it.confirmedById):personLabel(normKey(it.confirmedBy))) || (it.confirmedById && PROFILE_BY_ID[it.confirmedById] ? PROFILE_BY_ID[it.confirmedById].name : '') || '?'; return confirmerIsOwner(it) ? 'vlastník '+who : who+' (není vlastník)'; }
  function confirmTagHtml(it){
    var s = confirmState(it);
    if(s==='fresh') return '<span class="confirm-tag fresh" title="Stav potvrdil: '+esc(confirmWho(it))+', '+esc(fmtDT(it.confirmedAt))+'">'+icon('check',10)+' potvrzeno '+fmtRelative(it.confirmedAt)+(confirmerIsOwner(it)?'':' · ne vlastník')+'</span>';
    if(s==='changed') return '<span class="confirm-tag stale" title="Po potvrzení ('+esc(confirmWho(it))+', '+esc(fmtDT(it.confirmedAt))+') se změnil stav, termín nebo další krok — potvrzení už neplatí">'+icon('clock',10)+' změněno po potvrzení</span>';
    if(s==='stale') return '<span class="confirm-tag stale" title="Poslední potvrzení: '+esc(confirmWho(it))+', '+esc(fmtDT(it.confirmedAt))+'">'+icon('clock',10)+' nepotvrzeno '+daysSince(it.confirmedAt)+' d</span>';
    return '<span class="confirm-tag stale" title="Stav ještě nikdo nepotvrdil">'+icon('help',10)+' stav nepotvrzen</span>';
  }
  // pole potvrzení — jen kdo a kdy; „kým“ je ověřené id účtu, ne editovatelný text
  function confirmPatch(){ return { confirmedAt:Date.now(), confirmedBy:myKey(), confirmedById:sharedId(), confirmStale:false }; }
  // potvrzení při založení jen tehdy, když zakladatel je zároveň vlastník (přijímá odpovědnost za vlastní zápis)
  function confirmIfSelfOwned(d){ var mine = ownerIsMe(d); return mine ? confirmPatch() : { confirmedAt:0, confirmedBy:'', confirmedById:'', confirmStale:false }; }

  // --- návaznosti: typované odkazy 'project:<id>' / 'task:<id>' ------------
  function refOf(kind, id){ return kind+':'+id; }
  function itemByRef(ref){
    if(!ref) return null; var i=ref.indexOf(':'); if(i<0) return null;
    var kind=ref.slice(0,i), id=ref.slice(i+1);
    var arr = kind==='project'?STATE.projects : kind==='task'?STATE.tasks : [];
    var it = arr.find(function(x){ return x.id===id; });
    return it ? { kind:kind, item:it } : null;
  }
  function depsOf(it){ return Array.isArray(it&&it.dependsOn)?it.dependsOn:[]; }
  function itemStart(it){ return it.startDate||it.dueDate||''; }
  // ROZSAH PROJEKTU NA OSE (v2.20): vlastní Začátek/Termín; chybí-li, bere se od nejdřívějšího do nejpozdějšího kroku
  // (živé úkoly projektu včetně hotových). Odvozený rozsah se kreslí odlišně a nikdy se nezapisuje do dat.
  function projectTaskSpan(pid){ var st='',en=''; tasksOfProject(pid).forEach(function(t){ var a=itemStart(t), b=itemEnd(t); if(a&&(!st||a<st)) st=a; if(b&&(!en||b>en)) en=b; }); return (st&&en)?{st:st,en:en}:null; }
  function projectSpan(p){ var sp=projectTaskSpan(p.id); var st=p.startDate||(sp?sp.st:'')||p.dueDate||'', en=(p.dueDate?effectiveDue(p):'')||(sp?sp.en:'')||p.startDate||''; return {st:st,en:en,derivedStart:!p.startDate&&!!sp,derivedEnd:!p.dueDate&&!!sp,tasks:sp}; }
  function rowStart(r){ return r.st||itemStart(r.item); }
  function rowEnd(r){ return r.en||itemEnd(r.item); }
  function itemEnd(it){ return effectiveDue(it)||it.startDate||''; }   // v2.24: týden končí nedělí, měsíc posledním dnem
  // uzavřeno = úkol hotový, nebo projekt v životním cyklu Dokončený
  function isClosed(kind, it){ return kind==='task' ? it.status==='done' : it.lifecycle==='done'; }
  // předchůdci, na které položka skutečně čeká: nedokončené, včetně ARCHIVOVANÝCH nedokončených
  // (archivace není splnění) a CHYBĚJÍCÍCH (smazaná položka není splněný předchůdce) — V2-03
  function openPreds(it){
    var out=[];
    depsOf(it).forEach(function(ref){ var f=itemByRef(ref); if(!f){ out.push({ ref:ref, missing:true, title:'smazaná položka' }); return; } if(isClosed(f.kind,f.item)) return; out.push({ kind:f.kind, item:f.item, ref:ref, archived:!!f.item.archived, title:f.item.title+(f.item.archived?' (v koši)':'') }); });
    return out;
  }
  function isBlocked(it){ return openPreds(it).length>0; }
  function waitingText(it){
    var parts=[];
    openPreds(it).forEach(function(p){ parts.push(p.title); });
    if(it.waitingReason) parts.push(it.waitingReason);
    return parts.join(' · ');
  }
  function wouldCycle(selfRef, candRef, seen){
    seen = seen||{}; if(candRef===selfRef) return true; if(seen[candRef]) return false; seen[candRef]=true;
    var f=itemByRef(candRef); if(!f) return false;
    return depsOf(f.item).some(function(r){ return wouldCycle(selfRef, r, seen); });
  }
  // ověření sady návazností při uložení — vrátí text chyby, nebo ''
  function validateDeps(kind, d, refs){
    var selfRef = d.id ? refOf(kind, d.id) : '';
    for(var i=0;i<refs.length;i++){
      var r=refs[i], f=itemByRef(r);
      if(!f) return 'Návaznost odkazuje na položku, která už neexistuje.';
      if(selfRef && r===selfRef) return 'Položka nemůže navazovat sama na sebe.';
      if(kind==='task' && f.kind==='project' && f.item.id===d.projectId) return 'Úkol nemůže čekat na dokončení projektu, do kterého sám patří.';
      if(kind==='project' && f.kind==='task' && f.item.projectId===d.id) return 'Projekt nemůže čekat na vlastní úkol — dokončil by se až po sobě samém.';
      if(selfRef && wouldCycle(selfRef, r)) return 'Tahle návaznost by vytvořila cyklus: „'+f.item.title+'“ už (přímo nebo přes další položky) čeká na tuhle položku.';
    }
    return '';
  }
  // co položku uvolní (kdo na ni čeká)
  function dependents(kind, id, includeArchived){
    var ref=refOf(kind,id), out=[];
    STATE.projects.forEach(function(p){ if((includeArchived||!p.archived) && depsOf(p).indexOf(ref)>=0) out.push({kind:'project', item:p}); });
    STATE.tasks.forEach(function(t){ if((includeArchived||!t.archived) && depsOf(t).indexOf(ref)>=0) out.push({kind:'task', item:t}); });
    return out;
  }
  // rizika z návazností (informativní)
  function dependencyIssues(kind, it){
    var out=[];
    depsOf(it).forEach(function(ref){
      var f=itemByRef(ref); if(!f||f.item.archived) return; var pred=f.item;
      if(!isClosed(f.kind,pred) && isOverdueItem(pred)) out.push('Předchůdce po termínu: '+pred.title);
      if(!isClosed(f.kind,pred)){
        var running = kind==='task' ? (it.status==='in_progress'||it.status==='done') : (it.lifecycle==='active' && it.status==='green');
        if(running) out.push('Běží, ale čeká na nedokončené: '+pred.title);
      }
      if(it.startDate && pred.dueDate && it.startDate < pred.dueDate) out.push('Začíná před koncem předchůdce: '+pred.title);
    });
    return out;
  }
  // JEDNOTNÉ pravidlo návazností (V2-03): položka nesmí být v běhu ani hotová, dokud má
  // nesplněného předchůdce. Platí pro úkoly (status) i projekty (lifecycle), ve všech cestách.
  function isRunningState(kind, v){ return kind==='task' ? (v==='in_progress'||v==='done') : (v==='active'||v==='done'); }
  function depBlockText(kind, it, newState){
    if(!isRunningState(kind, newState)) return '';
    var preds = openPreds(it);
    if(!preds.length) return '';
    var verb = newState==='done' ? 'dokončit' : (kind==='task' ? 'zahájit' : 'aktivovat');
    return 'Nelze '+verb+': čeká na '+preds.map(function(p){ return '„'+p.title+'“'; }).join(', ')+'.';
  }
  // smí úkol přejít do daného stavu? (kompatibilní obal)
  function transitionBlock(t, newStatus){ return depBlockText('task', t, newStatus); }
  // předchůdci úkolu mimo daný projekt (pro hromadné dokončení projektu)
  // předchůdci mimo množinu úkolů dokončovaných v téže operaci (ne podle projektu: archivovaný nesplněný
  // úkol projektu se nedokončuje, a proto dál blokuje) — V21-04
  function externalOpenPreds(t, closeIds){ return openPreds(t).filter(function(p){ return p.missing || !(p.kind==='task' && closeIds[p.item.id]); }); }

  // --- pozornost pro poradu -----------------------------------------------
  // severity: 3 blokující/kritické, 2 po termínu, 1 nepotvrzeno / kvalita dat
  function attentionReasons(){
    var out=[];
    openProjects().forEach(function(p){
      var r=[];
      if(p.status==='red') r.push({label:'Kritický projekt', sev:3});
      if(p.blocker.trim()) r.push({label:'Blokátor: '+p.blocker, sev:3});
      if(p.decisionNeeded.trim()) r.push({label:'Čeká na rozhodnutí: '+p.decisionNeeded, sev:3});
      if(isBlocked(p)) r.push({label:'Čeká na: '+waitingText(p), sev:2});
      if(isOverdueItem(p)) r.push({label:'Dodání po termínu', sev:2});
      if(isCheckOverdue(p)) r.push({label:'Kontrola po termínu ('+fmtDate(p.nextCheckDate)+')', sev:2});
      if(p.lifecycle==='active' && nextStepStale(p)) r.push({label:'Další krok už je hotový — doplnit nový', sev:1});
      dependencyIssues('project',p).forEach(function(t){ r.push({label:t, sev:2}); });
      if(p.lifecycle==='active' && confirmState(p)!=='fresh') r.push({label:'Stav nepotvrzen', sev:1});
      if(!ownerKey(p)) r.push({label:'Bez vlastníka', sev:1});
      if(p.lifecycle==='active' && !nextStepText(p)) r.push({label:'Chybí další krok', sev:1});
      if(p.lifecycle==='active' && !p.dueDate && !p.nextCheckDate) r.push({label:'Termín neurčen', sev:1});
      if(r.length) out.push({kind:'project', item:p, reasons:r, sev:Math.max.apply(null,r.map(function(x){return x.sev;}))});
    });
    liveTasks().forEach(function(t){
      if(t.status==='done') return;
      var r=[];
      if(isOverdueItem(t)) r.push({label:'Úkol po termínu', sev:2});
      if(isCheckOverdue(t)) r.push({label:'Kontrola po termínu ('+fmtDate(t.nextCheckDate)+')', sev:2});
      if(t.waitingReason) r.push({label:'Potřebuje pomoc: '+t.waitingReason, sev:3});
      if(isBlocked(t)) r.push({label:'Čeká na: '+waitingText(t), sev:2});
      if(!ownerKey(t) && t.department) r.push({label:'Bez vlastníka', sev:1});
      if(r.length) out.push({kind:'task', item:t, reasons:r, sev:Math.max.apply(null,r.map(function(x){return x.sev;}))});
    });
    out.sort(function(a,b){ if(b.sev!==a.sev) return b.sev-a.sev; var ad=a.item.dueDate||'9999', bd=b.item.dueDate||'9999'; return ad<bd?-1:ad>bd?1:0; });
    return out;
  }

  function peopleList(){
    var map={};
    function touch(key){ if(!key) return null; if(!map[key]) map[key]={key:key,depts:{},open:0,overdue:0,running:0,blocked:0,projects:0,redProjects:0}; return map[key]; }
    openProjects().forEach(function(p){ var e=touch(ownerKey(p)); if(!e) return; e.projects++; if(p.department) e.depts[p.department]=1; if(p.status==='red') e.redProjects++; if(isOverdueItem(p)) e.overdue++; });
    liveTasks().forEach(function(t){ var e=touch(ownerKey(t)); if(!e) return; if(t.department) e.depts[t.department]=1; if(t.status==='done') return; e.open++; if(t.status==='in_progress') e.running++; if(isOverdueItem(t)) e.overdue++; if(isBlocked(t)||t.waitingReason) e.blocked++; });
    var me=myKey(); if(me) touch(me);
    return Object.keys(map).map(function(k){return map[k];}).sort(function(a,b){ return (b.overdue-a.overdue)||(b.open-a.open)||(a.key<b.key?-1:1); });
  }
  function mainDeptOf(key){
    var c={}; STATE.tasks.concat(STATE.projects).forEach(function(it){ if(!it.archived && ownerKey(it)===key && it.department) c[it.department]=(c[it.department]||0)+1; });
    var best='',n=0; Object.keys(c).forEach(function(d){ if(c[d]>n){n=c[d];best=d;} }); return best;
  }
  function bucketsFor(pred){
    var today=todayStr(), weekEnd=addDays(today, 6-dowMon(today));
    var b={overdue:[],checkdue:[],week:[],later:[],nodate:[],done:[]};
    liveTasks().forEach(function(t){
      if(!pred(t)) return;
      var eff=JUST_TOGGLED[t.id]||t.status;
      if(eff==='done'){ b.done.push(t); return; }
      // dodání po termínu a kontrola po termínu jsou dvě různé věci (V2-06)
      if(isOverdueItem(t)){ b.overdue.push(t); return; }
      if(isCheckOverdue(t)){ b.checkdue.push(t); return; }
      var d=effectiveDue(t)||t.nextCheckDate;
      if(!d){ b.nodate.push(t); return; }
      if(d<=weekEnd) b.week.push(t); else b.later.push(t);
    });
    function byDue(x,y){ return (x.dueDate||'9999')<(y.dueDate||'9999')?-1:1; }
    b.overdue.sort(byDue); b.checkdue.sort(function(x,y){ return (x.nextCheckDate||'9999')<(y.nextCheckDate||'9999')?-1:1; }); b.week.sort(byDue); b.later.sort(byDue);
    b.done.sort(function(x,y){ return (y.updatedAt||0)-(x.updatedAt||0); });
    return b;
  }

    db.collection('projects').onSnapshot(function(snap){
      STATE.projects = snap.docs.map(function(d){ return normP(Object.assign({id:d.id}, d.data())); });

    }, function(err){ console.error('projects onSnapshot', err); setConn('err','odběr projektů spadl'); });

    db.collection('tasks').onSnapshot(function(snap){
      STATE.tasks = snap.docs.map(function(d){ return normT(Object.assign({id:d.id}, d.data())); });
      STATE.loadedTasks=true; render(); refreshProfiles();
    }, function(err){ console.error('tasks onSnapshot', err); setConn('err','odběr úkolů spadl'); });

    // soukromé To-Do: data/users/<id>/private/todos — podstrom, který platforma
    // drží soukromý pro každého diváka, včetně vlastníka artefaktu

  function qaSubmit(surface){
    if(!db) return;
    var input=document.getElementById('qa-'+surface);
    var title=((input?input.value:STATE.qaText[surface])||'').trim();
    if(!title){ STATE.qaMsg[surface]={text:'Napiš, co se má udělat.',err:true}; render(); return; }
    if(STATE.qaBusy[surface]) return;
    // celý vstup se zachytí PŘED překreslením (V2-08)
    var deptEl0=document.getElementById('qa-dept-'+surface); if(deptEl0) STATE.qaDept[surface]=deptEl0.value;
    STATE.qaText[surface]=title; STATE.qaBusy[surface]=true; STATE.qaMsg[surface]=null; render();
    if(qaStartDate(surface)&&qaDueDate(surface)&&qaStartDate(surface)>qaDueDate(surface)){ STATE.qaBusy[surface]=false; STATE.qaMsg[surface]={text:'Začátek je až po termínu.',err:true}; render(); return; }
    var done = function(text){ STATE.qaBusy[surface]=false; STATE.qaText[surface]=''; STATE.qaStart[surface]=''; STATE.qaMsg[surface]={text:text,err:false}; render(); var again=document.getElementById('qa-'+surface); if(again) again.focus(); };
    var fail = function(e){ console.error(e); STATE.qaBusy[surface]=false; STATE.qaMsg[surface]={text:'Neuloženo ('+(e&&e.code||'chyba')+'). Text zůstal, zkus to znovu.',err:true}; render(); };

    if(surface==='priv'){
      if(!ME.id){ fail({code:'bez identity'}); return; }
      Promise.resolve().then(function(){ return privateCol().doc(uid()).set({ title:title, dueDate:qaDueDate(surface), done:false, createdAt:Date.now(), updatedAt:Date.now() }); })
        .then(function(){ done('Soukromý bod přidán — vidíš ho jen ty.'); }).catch(fail);
      return;
    }
    // rychlé zadání v detailu projektu: útvar i vlastník se berou z projektu, úkol rovnou patří do něj
    var pm = surface==='proj' && STATE.modal && STATE.modal.type==='project' ? findDoc('projects', STATE.modal.data.id) : null;
    if(surface==='proj' && !pm){ fail({code:'projekt není otevřený'}); return; }
    var department = surface==='proj' ? pm.department : (STATE.qaDept[surface]!==undefined ? STATE.qaDept[surface] : (surface==='kanban' && DEPT_MAP[STATE.nav] ? STATE.nav : ''));
    var ownerEmail='', ownerUserId='';
    if(surface==='my' || surface==='kanban'){ ownerEmail=myKey(); ownerUserId=sharedId(); }
    if(surface==='proj'){ var qo=projectQaOwner(pm); ownerEmail=qo.ownerEmail; ownerUserId=qo.ownerUserId; }
    var intoProject='';
    if(surface==='proj') intoProject=pm.id;
    if(surface==='kanban' && STATE.tab==='tasks' && STATE.projFilter){ var pfp=STATE.projects.find(function(x){return x.id===STATE.projFilter;}); if(pfp) intoProject=pfp.id; }
    createDoc('tasks', Object.assign(confirmIfSelfOwned({ownerEmail:ownerEmail, ownerUserId:ownerUserId}), { title:title, department:department, ownerEmail:ownerEmail, ownerUserId:ownerUserId, priority:'stredni', status:'todo',
        startDate:qaStartDate(surface), dueDate:qaDueDate(surface), duePrecision:'day', dueUnconfirmed:false, nextCheckDate:'', projectId:intoProject, dependsOn:[], attachments:[],
        note:'', waitingReason:'', costPlanned:0, costActual:0,
        // měna se uloží výslovně: v projektu jeho měna, jinak CZK — uložený údaj = zobrazený (pravidlo z V28)
        costCurrency: intoProject ? liveTaskCurrency({costCurrency:'CZK'}, intoProject) : 'CZK' }, { ownerEmail:ownerEmail, ownerUserId:ownerUserId }))
      .then(function(res){ done('Přidáno: '+title+(qaDueDate(surface)?' ('+(qaStartDate(surface)?fmtDate(qaStartDate(surface))+' – ':'termín ')+fmtDate(qaDueDate(surface))+')':(qaStartDate(surface)?' (od '+fmtDate(qaStartDate(surface))+', bez termínu)':' — bez termínu'))+(surface==='inbox'?' · čeká v Inboxu na útvar a vlastníka':'')); if(res&&res.historyOk===false) histWarn(res); })
      .catch(fail);
  }

  function filteredProjects(){
    var pf=STATE.pf, me=myKey();

      if(pf.dept!=='all' && p.department!==pf.dept) return false;
      if(pf.owner==='me' ? !isMine(p) : (pf.owner!=='all' && ownerKey(p)!==pf.owner)) return false;
      if(pf.lc==='open' ? p.lifecycle==='done' : (pf.lc!=='all' && p.lifecycle!==pf.lc)) return false;
      if(pf.ceo && !p.ceoScope) return false;
      if(!matchesSearch(p.title+' '+ownerKey(p)+' '+ownerText(p)+' '+p.note, STATE.search)) return false;
      return true;
    }).sort(function(a,b){ var la=LC_ORDER.indexOf(a.lifecycle), lb=LC_ORDER.indexOf(b.lifecycle); if(la!==lb) return la-lb; var sa={red:0,yellow:1,green:2}[a.status], sb={red:0,yellow:1,green:2}[b.status]; if(sa!==sb) return sa-sb; return a.title.localeCompare(b.title,'cs'); });

  // v2.23: časový filtr nad kanbanem — jen zobrazení, stav jen v relaci. „Tento týden“ = termín nebo kontrola do neděle (včetně po termínu).
  var TASK_FILTERS=[['all','Vše'],['overdue','Po termínu'],['week','Tento týden'],['nodate','Bez termínu']];
  function taskFilterMatch(t, f){
    if(f==='all') return true; if(t.status==='done') return false;
    var d=effectiveDue(t)||'', c=t.nextCheckDate||'';
    if(f==='nodate') return !d && !c;
    if(f==='overdue') return isOverdueItem(t)||isCheckOverdue(t);
    if(f==='week'){ var today=todayStr(), we=addDays(today, 6-dowMon(today)); return (!!d && d<=we) || (!!c && c<=we); }   // V225-08: termín i kontrola zvlášť
    return true;
  }
  function taskFilterApply(tasks){ var f=STATE.taskFilter||'all'; return f==='all'?tasks:tasks.filter(function(t){ return taskFilterMatch(t,f); }); }
  function taskFilterRowHtml(tasks){
    return '<div class="filter-row" style="margin-top:-6px"><span class="filter-label">Ukázat</span>'+TASK_FILTERS.map(function(x){ var n=tasks.filter(function(t){ return taskFilterMatch(t,x[0]); }).length; return '<button type="button" class="filter-chip'+((STATE.taskFilter||'all')===x[0]?' active':'')+'" data-task-filter="'+x[0]+'">'+x[1]+(x[0]==='all'?'':' <span class="num">'+n+'</span>')+'</button>'; }).join('')+(STATE.taskFilter&&STATE.taskFilter!=='all'?'<span class="g-fold-hint">hotové úkoly filtr skrývá</span>':'')+'</div>';

        '<div class="kanban-drop" data-col="'+col.key+'">'+items.map(function(t){return renderTaskCard(t,col.key,dk);}).join('')+'</div></div>';

  // ---------------------------------------------------------------------
  // Tým & porada
  // ---------------------------------------------------------------------
  function teamBuckets(personKey){
    var today=todayStr(), weekEnd=addDays(today, 6-dowMon(today));
    var pick=function(it){ return !personKey || ownerKey(it)===personKey; };
    var b={ overdue:[], checkdue:[], week:[], blocked:[], decisions:[], unconfirmed:[], noowner:[] };
    openProjects().forEach(function(p){
      if(!pick(p)) return;
      if(isOverdueItem(p)) b.overdue.push({kind:'project',item:p});
      else if(effectiveDue(p) && effectiveDue(p)<=weekEnd) b.week.push({kind:'project',item:p});
      if(isCheckOverdue(p)) b.checkdue.push({kind:'project',item:p});
      if(p.blocker.trim()||isBlocked(p)) b.blocked.push({kind:'project',item:p});
      if(p.decisionNeeded.trim()) b.decisions.push({kind:'project',item:p});
      if(p.lifecycle==='active' && confirmState(p)!=='fresh') b.unconfirmed.push({kind:'project',item:p});
      if(!ownerKey(p)) b.noowner.push({kind:'project',item:p});
    });
    liveTasks().forEach(function(t){
      if(t.status==='done' || !pick(t)) return;
      if(isOverdueItem(t)) b.overdue.push({kind:'task',item:t});
      else if(effectiveDue(t) && effectiveDue(t)<=weekEnd) b.week.push({kind:'task',item:t});
      if(isCheckOverdue(t)) b.checkdue.push({kind:'task',item:t});
      if(t.waitingReason||isBlocked(t)) b.blocked.push({kind:'task',item:t});
      if(t.status!=='done' && t.department && confirmState(t)!=='fresh' && daysSince(t.updatedAt)>STALE_DAYS) b.unconfirmed.push({kind:'task',item:t});
      if(!ownerKey(t) && t.department) b.noowner.push({kind:'task',item:t});
    });
    Object.keys(b).forEach(function(k){ b[k].sort(function(x,y){ return (x.item.dueDate||'9999').localeCompare(y.item.dueDate||'9999'); }); });
    return b;
  }

    return '<div class="meet-item" data-open="'+e.kind+'" data-id="'+it.id+'">'+avatarHtml(k,22)+'<span class="t">'+(e.kind==='project'?'<span class="statusdot '+it.status+'" style="display:inline-block;margin-right:5px"></span>':'')+esc(it.title)+'</span><span class="s" title="'+esc(sub)+'">'+esc(sub)+'</span><span class="s num">'+esc(fmtDue(it))+'</span></div>';

  // Upomínky (ruční odeslání — M365 nemá Mail.Send)
  // ---------------------------------------------------------------------
  function reminderScope(){
    var today=todayStr(), horizon=addWorkdays(today,2), byOwner={};
    function add(kind,it){
      var key=ownerKey(it); if(!key||key.indexOf('@')<0) return;
      var due=effectiveDue(it), chk=it.nextCheckDate; var band=null, what='';
      if(due){ band= due<today?'overdue':(due===today?'today':(due<=horizon?'soon':null)); what='termín'; }
      if(!band && chk){ band= chk<today?'overdue':(chk===today?'today':(chk<=horizon?'soon':null)); what='kontrola'; }
      if(!band) return;
      if(!byOwner[key]) byOwner[key]={key:key,overdue:[],today:[],soon:[]};
      byOwner[key][band].push({kind:kind,item:it,what:what});
    }
    liveTasks().forEach(function(t){ if(t.status!=='done') add('task',t); });
    openProjects().forEach(function(p){ add('project',p); });
    return Object.keys(byOwner).map(function(k){return byOwner[k];}).sort(function(a,b){ return (b.overdue.length-a.overdue.length)||(b.today.length-a.today.length); });
  }
  function reminderLine(e){
    var it=e.item, bits=[it.title];
    if(e.kind==='project') bits.push('projekt, semafor '+STATUS_LABEL[it.status].toLowerCase()+', '+LC_LABEL[it.lifecycle].toLowerCase());
    var dm=DEPT_MAP[it.department]; if(dm) bits.push(dm.label);
    bits.push(e.what==='kontrola' ? 'kontrola '+fmtDate(it.nextCheckDate)+(it.dueDate?' (termín '+fmtDue(it)+')':'') : 'termín '+fmtDue(it));
    if(e.kind==='project'&&it.blocker.trim()) bits.push('blokátor: '+it.blocker);
    if(e.kind==='task'&&it.waitingReason) bits.push('čeká: '+it.waitingReason);
    return bits.join(' — ');
  }
  function reminderMailto(p){
    var groups=[['PO TERMÍNU',p.overdue],['DNES',p.today],['DO DVOU PRACOVNÍCH DNŮ',p.soon]];
    var lines=['Ahoj,','','přehled tvých termínů ze Semaforu Provozu:']; var shown=0;
    groups.forEach(function(g){ if(!g[1].length) return; lines.push('',g[0]); g[1].forEach(function(e){ if(shown<12){ lines.push('- '+reminderLine(e)); shown++; } }); });
    var total=p.overdue.length+p.today.length+p.soon.length; if(total>12) lines.push('','... a další '+(total-12)+' v aplikaci.');
    lines.push('','Aplikace: '+DB_URL);
    var parts=[]; if(p.overdue.length) parts.push(p.overdue.length+' po termínu'); if(p.today.length) parts.push(p.today.length+' dnes'); if(p.soon.length) parts.push(p.soon.length+' do dvou dnů');
    return 'mailto:'+encodeURIComponent(p.key)+'?subject='+encodeURIComponent('Semafor Provozu — tvé termíny ('+parts.join(', ')+')')+'&body='+encodeURIComponent(lines.join('\r\n'));
  }

    var odT=liveTasks().filter(function(t){return t.status!=='done'&&isOverdueItem(t);}), odP=openProjects().filter(function(p){return isOverdueItem(p);});
    var dueToday=liveTasks().filter(function(t){return t.status!=='done'&&t.dueDate===today;}), blockers=openProjects().filter(function(p){return p.blocker.trim();}), noOwner=liveTasks().filter(function(t){return t.status!=='done'&&!ownerKey(t);});

  function shiftApply(plan, predTitle, sel){
    var out={ done:[], skipped:[], failed:[] }, list=plan.can.filter(function(x){ return !sel || sel.indexOf(x.ref)>=0; });
    var txt='posunuto s předchůdcem „'+predTitle+'“ o '+(plan.delta>0?'+':'')+plan.delta+' dní';
    return list.reduce(function(chain, x){ return chain.then(function(){
      var col=x.kind==='project'?'projects':'tasks', id=x.item.id, title=x.item.title, ref=db.collection(col).doc(id), locked=false;
      return ref.acquire({ holder:lockHolder(), ttlMs:20000 }).catch(function(e){ return { acquired:false, error:e }; }).then(function(lk){

          var fresh = snap && snap.exists ? snap.data() : null;

  // ---------------------------------------------------------------------
  // otevírání / zavírání detailu — s uchováním rozepsaného konceptu (R08)

  var DRAFTS = {};   // key -> { base, rev, changed } : původní základ + jen pole, která uživatel změnil (V2-01)
  function draftKey(m){ return m.type+':'+(m.data.id||'new'); }
  var FORM_MAP={ title:'f-title', outcome:'f-outcome', nextStep:'f-nextstep', blocker:'f-blocker', decisionNeeded:'f-decision', decisionBy:'f-decisionby', waitingReason:'f-waiting', note:'f-note', dueDate:'f-due', startDate:'f-start', nextCheckDate:'f-check', department:'f-dept', lifecycle:'f-lc', projectId:'f-project', status:'f-status', priority:'f-prio', duePrecision:'f-dueprec', nextStepTaskId:'f-nexttask', costPlanned:'f-costplan', costActual:'f-costact', costCurrency:'f-costcur', charterGoal:'f-ch-goal', scopeIn:'f-ch-scopein', scopeOut:'f-ch-scopeout', benefits:'f-ch-benefits', sponsorEmail:'f-ch-sponsor', team:'f-ch-team', risks:'f-ch-risks' };
  // přečte formulář do m.data (bez ukládání)
  function readFormInto(m){
    if(!m||m.type==='pair') return;
    var g=function(id){ var el=document.getElementById(id); return el?el.value:undefined; };
    var d=m.data;
    Object.keys(FORM_MAP).forEach(function(k){ if(k==='status'&&m.type!=='task') return; var v=g(FORM_MAP[k]); if(v!==undefined) d[k]= (k==='costPlanned'||k==='costActual') ? numOrZero(v) : (k==='costCurrency' ? curOf(v) : v); });
    var cb=function(id){ var el=document.getElementById(id); return el?el.checked:undefined; };
    var c1=cb('f-ceo'); if(c1!==undefined) d.ceoScope=c1; var c2=cb('f-dueunc'); if(c2!==undefined) d.dueUnconfirmed=c2;
    var ms=g('f-milestones'); if(ms!==undefined) d.milestones=textToMilestones(ms);
    var sp=document.getElementById('f-status-picker'); if(sp&&m.type==='project') d.status=sp.getAttribute('data-current')||d.status;
  }
  function snapshotForm(){
    var m=STATE.modal; if(!m||m.type==='pair') return;
    readFormInto(m);
    var changed=diffFields(m.base, m.data); ['id','rev','updatedAt','updatedBy','updatedById','confirmStale','confirmedAt','confirmedBy','confirmedById'].forEach(function(k){ delete changed[k]; });
    if(m.mode==='new' || Object.keys(changed).length) DRAFTS[draftKey(m)]={ base:JSON.parse(JSON.stringify(m.base)), rev:m.rev, changed:JSON.parse(JSON.stringify(changed)), data: m.mode==='new'?JSON.parse(JSON.stringify(m.data)):null, savedAt:Date.now() };
    else delete DRAFTS[draftKey(m)];
  }
  function isDirty(m){ return !!Object.keys(diffFields(m.base, m.data)).length; }
  // obnova konceptu = tři stavy: původní záznam (draft.base), moje změny (draft.changed), současný záznam (data).
  // Nezměněná pole se berou ze současného záznamu; základ a verze zůstávají PŮVODNÍ, takže kontrola
  // kolizí při uložení vidí i cizí změny provedené mezitím a u stejného pole vyžaduje volbu.
  function openModal(type, mode, data, extra){
    if(STATE.modal){ snapshotForm(); releaseLock(STATE.modal); }
    var m={ type:type, mode:mode, data:data, base:JSON.parse(JSON.stringify(data)), rev:data.rev||0, token:uid(), lock:null, more:false, saving:false, dirty:false };
    if(extra) Object.keys(extra).forEach(function(k){ m[k]=extra[k]; });
    var dk=draftKey(m), dr=DRAFTS[dk];
    if(dr){
      if(mode==='new' && dr.data){ m.data=Object.assign({}, data, dr.data); }
      else if(dr.changed){
        // základ = živý záznam, ale u polí, která jsem měnil, PŮVODNÍ hodnota (aby se poznala cizí změna téhož pole)
        var b2=JSON.parse(JSON.stringify(data)); Object.keys(dr.changed).forEach(function(k){ b2[k]=dr.base[k]; });
        m.base=b2;
        m.data=Object.assign({}, data, dr.changed, { id:data.id, rev:data.rev });
        var live=data, clash=Object.keys(dr.changed).filter(function(k){ return !eqVal(dr.base[k],live[k]) && !eqVal(live[k],dr.changed[k]); });
        if(clash.length) m.draftClash=clash;
        m.draftChangedKeys=Object.keys(dr.changed);
      }
      m.dirty=true; m.draftRestored=true;
    }
    STATE.modal=m; render();
    if(m.draftRestored) setTimeout(function(){ if(STATE.modal!==m) return; setSaveMsg('Obnoven rozepsaný koncept'+(m.draftChangedKeys&&m.draftChangedKeys.length?' ('+m.draftChangedKeys.map(fieldLabel).join(', ')+')':'')+'.'); var sm=document.getElementById('f-savemsg'); if(sm) sm.innerHTML+=' <button type="button" class="btn btn-xs" data-action="discard-draft" title="Zahodit rozepsané a vrátit se k uloženému stavu">Zahodit koncept</button>'; if(m.draftClash&&m.draftClash.length) showAlert('<b>Pozor:</b> mezitím někdo změnil pole, která máš rozepsaná v konceptu: '+esc(m.draftClash.map(fieldLabel).join(', '))+'. Při uložení si vybereš, čí hodnota platí.','err'); }, 0);
  }

  // zámek: smí tento detail zapisovat? (kooperativní; „Přesto upravit“ je jediná výjimka)
  function memberBlocks(m){ return !!(MEMBER && m && m.mode==='edit' && !canEditItem(m.data)); }
  function lockBlocks(m){ return memberBlocks(m) || !!(m && m.lock && !m.lock.acquired && !m.lock.unknown && !m.forceEdit); }

  function afterSave(m, res, okText){

  }
