  function histWarn(res){ if(res && res.historyOk===false) toast('Uloženo, ale záznam do historie se nezapsal ('+(res.historyError&&res.historyError.code||'chyba')+'). Doplní se tlačítkem „Doplnit historii“ v detailu nebo dalším zápisem — jen v této otevřené stránce; po jejím obnovení se ztratí.', true); return res; }
  function saveFailed(m, e){ console.error(e); setSaving(m,false); if(STATE.modal===m) setSaveMsg('Neuloženo ('+(e&&e.code||'chyba')+'). Nic se neztratilo — zkus to znovu.',true); else toast('Uložení „'+(m.data.title||'')+'“ selhalo ('+(e&&e.code||'chyba')+'); koncept je uložený.', true); }

  // pole, která by přepsala cizí změnu stejného pole — VŠECHNA zapisovaná pole, nezávisle na rev (V2-01)
  function sameFieldConflicts(m, patch){
    var col=m.type==='project'?'projects':'tasks', live=findDoc(col,m.data.id); if(!live) return [];
    var out=[]; Object.keys(patch).forEach(function(k){ var mineChanged=!eqVal(m.base[k],patch[k]), theirsChanged=!eqVal(m.base[k],live[k]); if(mineChanged&&theirsChanged&&!eqVal(live[k],patch[k])) out.push({field:k,label:fieldLabel(k),mine:patch[k],theirs:live[k]}); });
    return out;
  }
  function conflictHtml(conf){ return '<b>Kolize: někdo mezitím změnil stejná pole.</b><ul class="conflict-list">'+conf.map(function(x){return '<li>'+esc(x.label)+': ty „'+esc(shortVal(x.mine))+'“, druhý „'+esc(shortVal(x.theirs))+'“</li>';}).join('')+'</ul><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-xs" data-action="conflict-mine">Zapsat moje hodnoty</button><button type="button" class="btn btn-xs" data-action="conflict-theirs">Nechat jejich, ostatní moje uložit</button></div>'; }
  function readCommonForm(){
    var g=function(id){ var el=document.getElementById(id); return el?el.value:''; };
    return { title:g('f-title').trim(), department:g('f-dept'), dueDate:g('f-due')||'', duePrecision:g('f-dueprec')||'day', nextCheckDate:g('f-check')||'', dueUnconfirmed:!!(document.getElementById('f-dueunc')&&document.getElementById('f-dueunc').checked),
      ownerEmail:normKey(g('f-owner')), ownerUserId:g('f-owner-id')||'', note:(document.getElementById('f-note')?g('f-note').trim():STATE.modal.data.note||''), startDate:(document.getElementById('f-start')?g('f-start')||'':STATE.modal.data.startDate||'') };
  }
  // změna existujícího závazku (termínu) vyžaduje důvod ve všech cestách (V2-11); první doplnění ne
  // „změna termínu“ = rozdíl oproti AKTUÁLNĚ uloženému záznamu (ne oproti základu): po „Nechat jejich“ se nic nemění
  function liveDue(m){ var col=m.type==='project'?'projects':'tasks'; var live=findDoc(col,m.data.id); return live ? live.dueDate : m.base.dueDate; }
  // V225-06: „změna termínu“ se posuzuje podle SKUTEČNÉHO konce (datum + přesnost: den / neděle týdne / konec měsíce), ne podle uloženého pomocného dne
  function liveEffDue(m){ var col=m.type==='project'?'projects':'tasks'; var live=findDoc(col,m.data.id)||m.base; return effectiveDue(live); }
  function payloadEffDue(p){ return effectiveDue({dueDate:p.dueDate, duePrecision:p.duePrecision}); }
  function dueChanged(m, payload){ return m.mode==='edit' && payloadEffDue(payload)!==liveEffDue(m); }
  function livePrec(m){ var col=m.type==='project'?'projects':'tasks'; var live=findDoc(col,m.data.id)||m.base; return live.duePrecision||'day'; }
  // V229-01: událost „termín“ nese i přesnost, aby historie ukázala „10. 10. 2026 → říjen 2026“, ne „10. 10. → 10. 10.“
  function dueEvent(m, payload, text){ return {type:'due',from:liveDue(m),to:payload.dueDate,fromP:livePrec(m),toP:payload.duePrecision||'day',text:text||''}; }
  function fmtDueEv(d,p){ return d ? fmtDue({dueDate:d,duePrecision:p||'day'}) : '—'; }
  function dueReasonNeeded(m, payload){ return dueChanged(m, payload) && !!liveDue(m); }
  // krok kolize: spočítat nad původním payloadem, při „Nechat jejich“ dosadit cizí hodnoty — VŽDY před validací (V22-02)
  function resolveConflicts(m, payload, opts, col){
    if(m.mode!=='edit') return true;
    var conf=sameFieldConflicts(m, payload);
    if(conf.length && !opts.resolveMine){ showAlert(conflictHtml(conf),'err'); return false; }
    if(opts.keepTheirs && conf.length){ var live=findDoc(col,m.data.id); conf.forEach(function(x){ payload[x.field]=live[x.field]; }); opts.conflictNote='Kolize u polí '+conf.map(function(x){return x.label;}).join(', ')+' — ponechána hodnota druhého uživatele, moje změna těchto polí se nezapsala'; }
    return true;
  }
  function dueReasonHtml(){ return '<b>Měníš už dohodnutý termín.</b> Důvod zůstane v historii: <div class="inline-form" style="margin-top:6px"><input type="text" id="f-duereason" placeholder="Proč se termín mění"><button type="button" class="btn btn-xs" data-action="due-reason-ok">Uložit s důvodem</button></div>'; }

  // volby z dialogů (výjimka, otevřené úkoly, důvod termínu, kolize) se v rámci jednoho ukládacího pokusu
  // SČÍTAJÍ (m.saveOpts), aby se žádná otázka nepoložila dvakrát a odpověď neztratila (V21-03); po úspěchu
  // nebo zrušení se vyčistí, aby se stará výjimka neuplatnila na jinou změnu
  function mergeSaveOpts(m, opts){ m.saveOpts = Object.assign({}, m.saveOpts||{}, opts||{}); return m.saveOpts; }
  function saveProjectFromForm(id, mode, opts){
    var m=STATE.modal; if(!m||m.saving) return; opts=mergeSaveOpts(m, opts);
    if(lockBlocks(m)){ showAlert('Položku právě upravuje někdo jiný. Počkej, nebo zvol „Přesto upravit“.','err'); return; }
    var c=readCommonForm(), g=function(x){ var el=document.getElementById(x); return el?el.value:''; };
    var payload=Object.assign({}, c, { outcome:g('f-outcome').trim(), lifecycle:g('f-lc')||'active', nextStep:g('f-nextstep').trim(), nextStepTaskId:g('f-nexttask')||'', blocker:g('f-blocker').trim(), decisionNeeded:g('f-decision').trim(), decisionBy:g('f-decisionby')||'ceo',
      ceoScope:!!(document.getElementById('f-ceo')&&document.getElementById('f-ceo').checked), status:(document.getElementById('f-status-picker')&&document.getElementById('f-status-picker').getAttribute('data-current'))||'yellow',
      costPlanned: numOrZero(g('f-costplan')), costCurrency: curOf(g('f-costcur')),
      milestones: document.getElementById('f-milestones')?textToMilestones(g('f-milestones')):m.data.milestones, dependsOn:m.data.dependsOn||[], attachments:m.data.attachments||[] });
    // charterová pole: čtou se jen když je sekce rozbalená; jinak zůstává hodnota z m.data (koncept / uložený stav)
    ['charterGoal','scopeIn','scopeOut','benefits','sponsorEmail','team','risks'].forEach(function(k){ var el=document.getElementById(FORM_MAP[k]); payload[k]= el ? (k==='sponsorEmail'?normKey(el.value):(k==='team'?teamList(el.value).map(teamNorm).join(', '):el.value.trim())) : (m.data[k]||''); });
    if(payload.nextStepTaskId) payload.nextStep='';
    if(!payload.title){ showAlert('Zadej název projektu.','err'); return; }
    // 1) konečný výsledek (včetně volby kolize) — 2) teprve pak všechna pravidla nad ním (V22-02)
    if(!resolveConflicts(m, payload, opts, 'projects')) return;
    if(payload.startDate&&payload.dueDate&&payload.startDate>payloadEffDue(payload)){ showAlert('Začátek je až po termínu'+(opts.keepTheirs?' (po převzetí cizího termínu uprav začátek)':'')+'.','err'); return; }
    // V27-01: měnu projektu nelze změnit, jakmile jsou v něm zadané peníze — změna by přeznačila
    // uložená čísla (100 € by se stalo 100 Kč). Kontroluje se proti ŽIVÝM datům, ne proti formuláři,
    // aby to platilo i když částky doplnil někdo jiný v mezičase.
    if(mode==='edit'){
      var liveP=findDoc('projects',id);
      if(liveP && curOf(payload.costCurrency)!==curOf(liveP.costCurrency) && projectHasCost(liveP)){
        var cs=document.getElementById('f-costcur'); if(cs) cs.value=curOf(liveP.costCurrency);
        payload.costCurrency=curOf(liveP.costCurrency);
        showAlert('<b>Měnu projektu už nelze změnit — jsou v něm zadané náklady.</b> Změna měny nepřepočítává částky, jen by přeznačila uložená čísla (z '+esc(fmtMoney(numOrZero(liveP.costPlanned)||projectCost(liveP).actual||1000, curOf(liveP.costCurrency)))+' by se stala stejná částka v jiné měně). Měnu má smysl nastavit u projektu dřív, než se zapíší částky; je‑li zadaná omylem, řeš to vědomě — nová evidence v novém projektu, ne mazání skutečných výdajů. Kurz pro součty se k přepočtu uložených částek zásadně nepoužívá.','err');
        return;
      }
    }
    var merged=Object.assign({},m.data,payload);
    var depErr=validateDeps('project', merged, payload.dependsOn); if(depErr){ showAlert(depErr,'err'); return; }
    // návaznosti nezávisle na semaforu: aktivace i dokončení projektu čeká na předchůdce (V2-03)
    var depsChanged=!eqVal(payload.dependsOn, m.base.dependsOn);
    if((payload.lifecycle!==m.base.lifecycle || depsChanged || mode==='new') && !opts.override){
      var pb=depBlockText('project', merged, payload.lifecycle);
      if(pb){ showAlert('<b>'+esc(pb)+'</b> Dokončení předchůdce projekt uvolní. Výjimka jen s důvodem: <div class="inline-form" style="margin-top:6px"><input type="text" id="f-override" placeholder="Důvod výjimky (zapíše se do historie)"><button type="button" class="btn btn-xs" data-action="override-block">Přesto změnit fázi</button></div>','err'); return; }
    }
    if(payload.status==='green'){
      var why=[]; if(!payload.ownerEmail&&!payload.ownerUserId) why.push('vlastník'); if(!payload.dueDate&&!payload.nextCheckDate) why.push('termín nebo datum kontroly'); if(mode!=='new' && !payload.nextStep&&!payload.nextStepTaskId) why.push('další krok');
      // v2.23: další krok vzniká až s úkoly — při založení se nevyžaduje. (V225-07: komentář dřív stál na konci řádku a vyřadil dvě kontroly níže.)
      if(payload.blocker) why.push('aktivní blokátor'); if(openPreds(merged).length) why.push('nesplněné návaznosti');
      if(why.length){ showAlert('Zelený semafor nelze uložit: '+why.join(', ')+'. Doplň, nebo zvol žlutou.','err'); return; }
    }
    // dokončení projektu s otevřenými úkoly — řešit výslovně
    var closeList=[];
    if(payload.lifecycle==='done' && m.base.lifecycle!=='done'){
      var openT=tasksOfProject(id).filter(function(t){return t.status!=='done';});
      if(openT.length && !opts.doneResolved){ showAlert('<b>Projekt má '+openT.length+' otevřených úkolů.</b> Co s nimi? <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-xs" data-action="done-keep">Nechat otevřené v projektu</button><button type="button" class="btn btn-xs" data-action="done-close">Označit všechny jako hotové</button><button type="button" class="btn btn-xs" data-action="done-cancel">Zpět, nedokončovat</button></div>','' ); return; }
      if(opts.closeTasks){
        closeList=openT;
        // hromadné dokončení: externí (mimo projekt) nesplněné návaznosti se vyhodnotí PŘEDEM
        var closeIds={}; openT.forEach(function(t){ closeIds[t.id]=1; });
        var ext=openT.filter(function(t){ return externalOpenPreds(t,closeIds).length; });
        if(ext.length && !opts.bulkReason){ showAlert('<b>'+ext.length+' úkolů čeká na položky, které se touto akcí nedokončí:</b> '+esc(ext.map(function(t){return t.title+' → '+externalOpenPreds(t,closeIds).map(function(p){return p.title;}).join(', ');}).join('; '))+'. Hromadně dokončit jen s důvodem: <div class="inline-form" style="margin-top:6px"><input type="text" id="f-bulkreason" placeholder="Důvod (zapíše se ke každému úkolu)"><button type="button" class="btn btn-xs" data-action="bulk-done-ok">Dokončit všechny s důvodem</button><button type="button" class="btn btn-xs" data-action="done-cancel">Zpět</button></div>','err'); return; }
      }
    }
    if(dueReasonNeeded(m,payload) && !opts.dueReason){ showAlert(dueReasonHtml(),''); return; }
    var shift = (mode==='edit' && dueChanged(m,payload) && liveDue(m) && payload.dueDate) ? shiftPlan('project', id, liveEffDue(m), payloadEffDue(payload)) : null;
    if(SHIFT_ENABLED && shift && shift.can.length && opts.shiftDeps===undefined){ showAlert(shiftHtml(shift),''); return; }
    showAlert(''); setSaving(m,true); setSaveMsg('Ukládám…');
    var events=[];
    if(opts.override) events.push({type:'override',text:opts.override});
    if(dueChanged(m,payload)) events.push(dueEvent(m,payload,opts.dueReason));   // jen skutečná změna oproti uloženému (V229-01: s přesností)
    var okText = mode==='new'?'Projekt založen.':'Uloženo.';
    // nejdřív úkoly (výsledek všech zápisů se čeká), teprve pak projekt jako dokončený
    if(opts.conflictNote) events.push({type:'conflict',text:opts.conflictNote});
    var pre = closeList.length ? Promise.all(closeList.map(function(t){ return saveDoc('tasks',t.id,Object.assign({status:'done'},confirmPatch()),{event:{type:opts.bulkReason?'override':'change',field:'status',label:'stav',from:t.status,to:'done',text:opts.bulkReason?('dokončeno s projektem — '+opts.bulkReason):'dokončeno s projektem'}}); })) : Promise.resolve([]);
    pre.then(function(rs){
      var histFail=rs.filter(function(r){return r&&r.historyOk===false;}).length;
      // V225-07: nový zelený projekt bez dalšího kroku je NÁVRH — nepotvrzuje se ani vlastníkem (potvrdí „Stav platí“ až s dalším krokem)
      var confirmNew = (payload.status==='green' && !payload.nextStep && !payload.nextStepTaskId) ? { confirmedAt:0, confirmedBy:'', confirmedById:'', confirmStale:false } : confirmIfSelfOwned(payload);
      var p = mode==='new' ? createDoc('projects', Object.assign(confirmNew, payload)).then(function(res){ return events.length ? appendHistory(res.id, events).then(function(){ return res; }, function(e){ return mergeRes(res,{ok:true,historyOk:false,historyError:e}); }) : res; })
                           : saveDoc('projects', id, payload, { base:m.base, events:events });
      return p.then(function(res){ if(histFail && res) res=mergeRes(res,{ok:true,historyOk:false,historyError:{code:histFail+'× historie úkolu'}}); var after=function(extra){ afterSave(m,res,okText+(closeList.length?' Dokončeno '+closeList.length+' úkolů.':'')+(extra||'')); };
        if(SHIFT_ENABLED && shift && opts.shiftDeps && shift.can.length) return shiftApply(shift, payload.title, opts.shiftSel).then(function(r){ after(shiftReport(r)); });
        after(shiftNotice(shift)); });
    }).catch(function(e){ if(closeList.length) toast('Hromadné dokončení úkolů selhalo — projekt zůstává nedokončený.', true); saveFailed(m,e); });
  }

  function saveTaskFromForm(id, mode, opts){
    var m=STATE.modal; if(!m||m.saving) return; opts=mergeSaveOpts(m, opts);
    if(lockBlocks(m)){ showAlert('Položku právě upravuje někdo jiný. Počkej, nebo zvol „Přesto upravit“.','err'); return; }
    var c=readCommonForm(), g=function(x){ var el=document.getElementById(x); return el?el.value:''; };
    var payload=Object.assign({}, c, { priority:g('f-prio')||'stredni', status:g('f-status')||'todo', projectId:g('f-project')||'', waitingReason:g('f-waiting').trim(),
      costPlanned: numOrZero(g('f-costplan')), costActual: numOrZero(g('f-costact')),
      costCurrency: (document.getElementById('f-costcur') ? curOf(g('f-costcur')) : curOf(m.data.costCurrency)),
      dependsOn:m.data.dependsOn||[], attachments:m.data.attachments||[] });
    if(!payload.title){ showAlert('Napiš, co má být hotové.','err'); return; }
    if(!resolveConflicts(m, payload, opts, 'tasks')) return;   // volba kolize PŘED validací (V22-02)
    if(payload.startDate&&payload.dueDate&&payload.startDate>payloadEffDue(payload)){ showAlert('Začátek je až po termínu'+(opts.keepTheirs?' (po převzetí cizího termínu uprav začátek)':'')+'.','err'); return; }
    var missing=[]; if(payload.department && !payload.ownerEmail && !payload.ownerUserId) missing.push('odpovědný člověk'); if(payload.department && !payload.dueDate && !payload.nextCheckDate) missing.push('termín nebo datum kontroly');
    if(missing.length && (mode==='new' || (m.base.department!==payload.department && payload.department))){ showAlert('Týmový úkol potřebuje: '+missing.join(', ')+'. Doplň, nebo nech úkol bez útvaru v Inboxu.','err'); return; }
    var softWarn = missing.length ? 'Uloženo, ale úkolu chybí: '+missing.join(', ')+'.' : '';
    // ===== MĚNA ÚKOLU — jedno pravidlo pro všechny cesty (V27-01, V28-01, V28-02) =====
    // Uložené peníze nesmí tiše změnit měnu, ať se sáhne na projekt, na výběr měny, nebo se úkol zakládá.
    //  • VYJMUTÍ z projektu si vždy ponese dosavadní efektivní měnu (stejné pravidlo jako detachPatch),
    //    i když má úkol v datech starou nesouhlasnou hodnotu — proto se nikdy neodmítá.
    //  • Uložené peníze + jiná cílová měna = odmítnuto (přesun i pouhá změna výběru měny).
    //  • Rozepsaná částka u nového nebo bezpeněžního úkolu se řeší potvrzením v formuláři (renderCurAsk).
    // Rozhoduje se podle ŽIVÝCH dat, částky mohl doplnit někdo jiný.
    (function(){
      var liveT = (mode==='edit' ? (findDoc('tasks',id) || m.data) : m.data);
      var storedMoney = mode==='edit' && taskHasCost(liveT);
      var curBefore = mode==='edit' ? liveTaskCurrency(liveT) : formTaskCurrency(m.base);
      var curAfter  = liveTaskCurrency({ costCurrency: payload.costCurrency }, payload.projectId);
      var isDetach  = mode==='edit' && !!m.base.projectId && !payload.projectId;
      if(isDetach){ payload.costCurrency = curBefore; return; }        // V28-02
      if(storedMoney && curBefore!==curAfter){
        var pj=payload.projectId?findDoc('projects',payload.projectId):null;
        var sel=document.getElementById('f-project'); if(sel) sel.value=m.base.projectId||'';
        var cs=document.getElementById('f-costcur'); if(cs) cs.value=curBefore;
        var what = (payload.projectId||'')!==(m.base.projectId||'') ? 'Tenhle přesun nelze provést' : 'Měnu už zadaných částek nelze takhle změnit';
        payload.projectId=m.base.projectId||''; payload.costCurrency=curBefore;
        showAlert('<b>'+what+' — změnil by se význam uloženého čísla.</b> Úkol má peníze v <b>'+esc(curBefore)+'</b>, cíl je v <b>'+esc(curAfter)+'</b>'+(pj?' (projekt „'+esc(pj.title)+'“)':'')+'. Aplikace částky nepřepočítává a kurz pro součty k tomu nepoužívá. Úkol s evidovanými náklady jde přesunout do projektu <b>ve stejné měně</b>; vyjmout z projektu ho lze vždy a měna mu zůstane. Pokud je měna zadaná omylem, oprav ji vědomě — smazat skutečný výdaj kvůli přeřazení není správná cesta.','err');
        m.blockSave=true; return;
      }
      payload.costCurrency = curAfter;   // povolená cesta: uložený údaj odpovídá tomu, co je vidět
    })();
    if(m.blockSave){ m.blockSave=false; return; }
    // rozepsaná částka po změně projektu čeká na vědomé potvrzení (V28-01 B)
    if(m.curAsk && !m.curOk && (numOrZero(payload.costPlanned)||numOrZero(payload.costActual))){
      renderCurAsk();
      showAlert('Nejdřív potvrď, v jaké měně je zadaná částka (panel nad tlačítkem Uložit) — nebo projekt vrať zpět.','err');
      return;
    }
    var merged=Object.assign({},m.data,payload);
    var depErr=validateDeps('task', merged, payload.dependsOn); if(depErr){ showAlert(depErr,'err'); return; }
    // kontrola návazností při změně stavu I při změně vazeb nebo zařazení u běžícího úkolu (V2-03)
    var depsChanged=!eqVal(payload.dependsOn,m.base.dependsOn)||payload.projectId!==m.base.projectId;
    if((payload.status!==m.base.status || depsChanged || mode==='new') && !opts.override){
      var tb=transitionBlock(merged, payload.status);
      if(tb){ showAlert('<b>'+esc(tb)+'</b> Dokončení předchůdce úkol uvolní. Výjimka jen s důvodem: <div class="inline-form" style="margin-top:6px"><input type="text" id="f-override" placeholder="Důvod výjimky (zapíše se do historie)"><button type="button" class="btn btn-xs" data-action="override-block">Přesto změnit stav</button></div>','err'); return; }
    }
    if(dueReasonNeeded(m,payload) && !opts.dueReason){ showAlert(dueReasonHtml(),''); return; }
    var shift = (mode==='edit' && dueChanged(m,payload) && liveDue(m) && payload.dueDate) ? shiftPlan('task', id, liveEffDue(m), payloadEffDue(payload)) : null;
    if(SHIFT_ENABLED && shift && shift.can.length && opts.shiftDeps===undefined){ showAlert(shiftHtml(shift),''); return; }
    showAlert(''); setSaving(m,true); setSaveMsg('Ukládám…');
    var events=[];
    if(opts.override) events.push({type:'override',text:opts.override});
    if(dueChanged(m,payload)) events.push(dueEvent(m,payload,opts.dueReason));
    if(mode==='edit' && payload.status==='done' && m.base.status!=='done') Object.assign(payload, confirmPatch());
    var okText = softWarn || (mode==='new'?'Úkol založen — vlastník ho uvidí v Moje práce.':'Uloženo.');
    if(opts.conflictNote) events.push({type:'conflict',text:opts.conflictNote});
    var p = mode==='new' ? createDoc('tasks', Object.assign(confirmIfSelfOwned(payload), payload), m.meeting?{type:'decision',text:'Akce založena na poradě'}:null).then(function(res){ return events.length ? appendHistory(res.id, events).then(function(){ return res; }, function(e){ return mergeRes(res,{ok:true,historyOk:false,historyError:e}); }) : res; })
                         : saveDoc('tasks', id, payload, { base:m.base, events:events });
    p.then(function(res){ if(m.fromPrivate){ return privateCol().doc(m.fromPrivate).delete().then(function(){ return res; }, function(){ toast('Týmový úkol vznikl, ale soukromý bod se nepodařilo smazat — smaž ho ručně.', true); return res; }); } return res; })
     .then(function(res){ if(SHIFT_ENABLED && shift && opts.shiftDeps && shift.can.length) return shiftApply(shift, payload.title, opts.shiftSel).then(function(r){ afterSave(m,res,okText+shiftReport(r)); }); afterSave(m,res,okText+shiftNotice(shift)); }).catch(function(e){ saveFailed(m,e); });
  }

  // archivace místo mazání (R09): vazby zůstávají, projekt se jen skryje; vyjmutí úkolů je oddělená volba (V2-04)

  // ---------------------------------------------------------------------
  // PŘEVOD projekt ↔ úkol (v2.17). Špatně založená položka se nepřepisuje na místě (kolekce jsou různé):
  // vznikne NOVÁ položka se stejnými údaji a historií, návaznosti ostatních se přepíšou na ni a původní
  // jde do Koše s odkazem „převedeno na …“. Nic se nemaže natrvalo.
  // ---------------------------------------------------------------------
  // REVIZE 11 (V217-01..03): převod je VYPNUTÝ — opakování po chybě dělalo duplicity a dělilo návaznosti,
  // přenos historie byl neúplný a plán dokončeného úkolu se počítal dvakrát. Kód zůstává pro budoucí opravu.
  var CONVERT_ENABLED = false;
  function convertBlockers(kind, it){
    var out=[];
    if(kind==='project'){
      var sub=STATE.tasks.filter(function(t){ return t.projectId===it.id; });
      if(sub.length) out.push('Projekt má '+sub.length+' úkolů'+(sub.some(function(t){return t.archived;})?' (včetně archivovaných)':'')+'. Nejdřív je vyjmi (v seznamu úkolů) nebo přesuň jinam.');
    } else {
      if(numOrZero(it.costActual)>0) out.push('Úkol má evidované skutečné čerpání '+fmtMoney(numOrZero(it.costActual),liveTaskCurrency(it))+'. Projekt čerpání nemá vlastní — vzniká z kroků. Založ projekt ručně a tenhle úkol do něj přesuň.');
    }
    return out;
  }
  function convertTarget(kind, it){
    var noteBits=[it.note||''];
    if(kind==='project'){
      if((it.outcome||'').trim()) noteBits.push('Očekávaný výsledek: '+it.outcome.trim());
      if((it.decisionNeeded||'').trim()) noteBits.push('Potřebné rozhodnutí ('+(it.decisionBy==='vedeni'?'vedení':'CEO')+'): '+it.decisionNeeded.trim());
      if((it.nextStep||'').trim()) noteBits.push('Další krok: '+it.nextStep.trim());
      if((it.milestones||[]).length) noteBits.push('Milníky: '+it.milestones.map(function(m){ return (m.title||m.text||'')+(m.date?' ('+fmtDate(m.date)+')':''); }).join(', '));
      return normT({ title:it.title, department:it.department, ownerEmail:it.ownerEmail, ownerUserId:it.ownerUserId, priority:'stredni',
        status: it.lifecycle==='done'?'done':'todo', projectId:'', startDate:it.startDate, dueDate:it.dueDate, duePrecision:it.duePrecision, dueUnconfirmed:it.dueUnconfirmed, nextCheckDate:it.nextCheckDate,
        waitingReason:(it.blocker||'').trim(), note:noteBits.filter(Boolean).join('\n'), costPlanned:numOrZero(it.costPlanned), costActual:0, costCurrency:curOf(it.costCurrency),
        dependsOn:depsOf(it).slice(), attachments:(it.attachments||[]).slice(), confirmedAt:0, confirmedBy:'', confirmedById:'', confirmStale:false });
    }
    if((it.waitingReason||'').trim()) noteBits.push('Překážka z úkolu: '+it.waitingReason.trim());
    return normP({ title:it.title, department:it.department||'vyroba', ownerEmail:it.ownerEmail, ownerUserId:it.ownerUserId, status:'yellow',
      lifecycle: it.status==='done'?'done':'active', startDate:it.startDate, dueDate:it.dueDate, duePrecision:it.duePrecision, dueUnconfirmed:it.dueUnconfirmed, nextCheckDate:it.nextCheckDate,
      blocker:(it.waitingReason||'').trim(), note:noteBits.filter(Boolean).join('\n'), costPlanned:numOrZero(it.costPlanned), costCurrency:liveTaskCurrency(it),
      dependsOn:depsOf(it).slice(), attachments:(it.attachments||[]).slice(), milestones:[], ceoScope:false, confirmedAt:0, confirmedBy:'', confirmedById:'', confirmStale:false });
  }
  function convertAsk(kind, id){
    var col=kind==='project'?'projects':'tasks', it=findDoc(col,id); if(!it) return;
    if(lockBlocks(STATE.modal)){ toast('Položku právě upravuje někdo jiný.',true); return; }
    if(STATE.modal&&STATE.modal.dirty){ showAlert('Nejdřív ulož nebo zruš rozepsané změny — převod pracuje s uloženými údaji.','err'); return; }
    var to = kind==='project'?'úkol':'projekt', bl=convertBlockers(kind,it);
    if(bl.length){ showAlert('<b>Převod na '+to+' teď nejde.</b> '+esc(bl.join(' '))+'<div style="margin-top:6px"><button type="button" class="btn btn-xs" data-action="convert-cancel">Zavřít</button></div>','err'); return; }
    var target=convertTarget(kind,it), depErr=validateDeps(kind==='project'?'task':'project', target, depsOf(target));
    var deps=dependents(kind,id,true), lines=[];
    lines.push('Vznikne '+to+' „'+esc(it.title)+'“ se stejným vlastníkem, útvarem, termínem, poznámkou, plánem nákladů, přílohami a celou historií.');
    if(kind==='project') lines.push('Semafor, očekávaný výsledek, rozhodnutí a milníky se u úkolu nevedou — přepíšou se do poznámky, aby se nic neztratilo.'+(it.ceoScope?' Označení pro CEO přehled zanikne.':''));
    else lines.push('Semafor nového projektu bude „Pozor“, stav bude nepotvrzený — potvrď ho po kontrole.');
    if(deps.length) lines.push(deps.length+' položek na tuhle navazuje — návaznost se přepíše na novou položku: '+esc(deps.map(function(x){return x.item.title;}).join(', '))+'.');
    if(depErr) lines.push('Návaznosti se nepřenesou ('+esc(depErr)+') — nastav je u nové položky ručně.');
    lines.push('Původní '+(kind==='project'?'projekt':'úkol')+' půjde do Koše s odkazem na novou položku.');
    showAlert('<b>Převést na '+to+'?</b><br>'+lines.join('<br>')+
      '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-xs btn-primary" data-action="convert-confirm" data-kind="'+kind+'" data-id="'+id+'">Převést na '+to+'</button><button type="button" class="btn btn-xs" data-action="convert-cancel">Zpět</button></div>','');
  }
  function convertItem(kind, id){
    var col=kind==='project'?'projects':'tasks', it=findDoc(col,id), m=STATE.modal; if(!it||!db) return;
    if(convertBlockers(kind,it).length){ convertAsk(kind,id); return; }
    var toKind=kind==='project'?'task':'project', toCol=toKind==='project'?'projects':'tasks', target=convertTarget(kind,it);
    if(validateDeps(toKind,target,depsOf(target))) target.dependsOn=[];
    var busyBtn=document.querySelector('[data-action="convert-confirm"]'); if(busyBtn){ busyBtn.disabled=true; busyBtn.textContent='Převádím…'; }
    var newId=null, oldRef=refOf(kind,id), label=kind==='project'?'projektu':'úkolu';
    loadHistory(id).then(function(oldEvents){
      return createDoc(toCol, target, { type:'converted', text:'Převedeno z '+label+' „'+it.title+'“ (původní položka je v Koši)' }).then(function(res){
        newId=res.id;
        // původní historie se přenese i s časem a autorem (id událostí zůstává → žádné duplikáty)
        var carried=(oldEvents||[]).map(function(e){ return Object.assign({}, e, { carriedFrom:oldRef }); });
        return carried.length ? appendHistory(newId, carried).catch(function(e){ console.error('history carry', e); }) : null;
      });
    }).then(function(){
      var newRef=refOf(toKind,newId);
      // návaznosti ostatních položek → na novou
      var fixes=dependents(kind,id,true).map(function(x){ var d=depsOf(x.item).map(function(r){ return r===oldRef?newRef:r; }); return saveDoc(x.kind==='project'?'projects':'tasks', x.item.id, {dependsOn:d}, {event:{type:'converted',text:'Návaznost přepsána: '+it.title+' byl převeden na '+(toKind==='project'?'projekt':'úkol')}}); });
      // projekt, který měl tenhle úkol jako „další krok“, dostane text místo odkazu
      if(kind==='task') STATE.projects.forEach(function(p){ if(p.nextStepTaskId===id) fixes.push(saveDoc('projects',p.id,{nextStepTaskId:'', nextStep:it.title},{event:{type:'converted',text:'Úkol dalšího kroku byl převeden na projekt; další krok zůstal jako text'}})); });
      return Promise.all(fixes);
    }).then(function(){
      return saveDoc(col,id,{archived:true,archivedAt:Date.now(),archivedBy:myKey(),archivedById:sharedId(),convertedTo:refOf(toKind,newId)},{event:{type:'converted',text:'Převedeno na '+(toKind==='project'?'projekt':'úkol')+' — nová položka, tahle jde do Koše'}});
    }).then(function(){
      toast('Převedeno. Původní '+(kind==='project'?'projekt':'úkol')+' je v Koši.');
      if(STATE.modal===m) closeModal(true);
      setTimeout(function(){ if(toKind==='project') openEditProject(newId); else openEditTask(newId); }, 50);
    }).catch(function(e){
      console.error('convert', e);
      var msg='Převod se nepovedl ('+(e&&e.code||'chyba')+').'+(newId?' Nová položka už vznikla — zkontroluj ji a původní případně archivuj ručně.':' Nic se nezměnilo.');
      if(STATE.modal===m) showAlert(msg,'err'); else toast(msg,true);
    });
  }
  function archiveItem(kind, id){
    var col=kind==='project'?'projects':'tasks', it=findDoc(col,id); if(!it) return;
    var deps=dependents(kind,id), sub=kind==='project'?tasksOfProject(id):[];
    var impact=[]; if(deps.length) impact.push(deps.length+' položek na tuhle čeká a zůstane blokovaných, dokud vazbu neodebereš: '+deps.map(function(x){return x.item.title;}).join(', '));
    showArchiveAlert('<b>Archivovat „'+esc(it.title)+'“?</b> '+(impact.length?'Dopad: '+esc(impact.join('. '))+'. ':'')+'Položku lze obnovit z Koše'+(sub.length?' i s jejími '+sub.length+' úkoly':'')+'.'+
      (sub.length?'<label class="check-row" style="margin-top:6px"><input type="checkbox" id="f-arch-detach"> Zároveň vyjmout '+sub.length+' úkolů z projektu (stanou se samostatnými akcemi; obnova projektu je už nevrátí)</label>':'')+
      '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap"><button type="button" class="btn btn-xs btn-danger" data-action="archive-confirm" data-kind="'+kind+'" data-id="'+id+'">Archivovat</button><button type="button" class="btn btn-xs" data-action="archive-cancel">Zpět</button></div>','');
  }
  function archiveConfirm(kind, id){
    var col=kind==='project'?'projects':'tasks', m=STATE.modal;
    var detach = !!(document.getElementById('f-arch-detach')&&document.getElementById('f-arch-detach').checked);
    var pre = (kind==='project'&&detach) ? Promise.all(tasksOfProject(id).map(function(t){ return saveDoc('tasks',t.id,detachPatch(t),{event:{type:'change',field:'projectId',label:'projekt',from:id,to:'',text:'vyjmuto při archivaci projektu'}}); })) : Promise.resolve([]);
    pre.then(function(){ return saveDoc(col,id,{archived:true,archivedAt:Date.now(),archivedBy:myKey(),archivedById:sharedId()},{event:{type:'archived',text:detach?'Archivováno, úkoly vyjmuty':'Archivováno'}}); })
      .then(function(res){ toast('Archivováno. Najdeš v Koši.'+(res&&res.historyOk===false?' (historie se nezapsala)':''), res&&res.historyOk===false); if(STATE.modal===m) closeModal(true); })
      .catch(function(e){ if(STATE.modal===m) showArchiveAlert('Archivace se nepovedla ('+(e&&e.code||'chyba')+').','err'); else toast('Archivace selhala ('+(e&&e.code||'chyba')+').',true); });
  }
  function restoreItem(kind,id){ var col=kind==='project'?'projects':'tasks'; saveDoc(col,id,{archived:false,archivedAt:0},{event:{type:'restored',text:'Obnoveno z koše'}}).then(function(res){ toast(kind==='project'?'Projekt obnoven včetně zařazení úkolů.':'Obnoveno.'); histWarn(res); }).catch(function(e){ toast('Obnova selhala ('+(e&&e.code||'chyba')+').',true); }); }
  // dopady trvalého smazání (text do potvrzovacího panelu v Koši)
  function purgeImpact(kind,id){
    var deps=dependents(kind,id,true), ns=kind==='task'?STATE.projects.filter(function(p){return p.nextStepTaskId===id;}):[], sub=kind==='project'?STATE.tasks.filter(function(t){return t.projectId===id;}):[];
    var lines=[];
    if(deps.length) lines.push('• '+deps.length+' položek (i archivovaných) na tuhle čeká — vazba se odebere, je to změna plánu.');
    if(ns.length) lines.push('• '+ns.length+' projektů má tuhle jako další krok — pole se vyprázdní.');
    if(sub.length) lines.push('• '+sub.length+' úkolů projektu zůstane jako samostatné akce (ponechají si dosavadní měnu).');
    // V27-02: smazání položky s evidovanými penězi mění čerpání projektu — řekni to výslovně
    if(kind==='task'){
      var t=findDoc('tasks',id);
      if(t && taskHasCost(t)){
        var pr=t.projectId?findDoc('projects',t.projectId):null, cur=liveTaskCurrency(t);
        lines.push('• Úkol má evidované náklady (plán '+fmtMoney(numOrZero(t.costPlanned),cur)+', čerpání '+fmtMoney(numOrZero(t.costActual),cur)+'). Smazáním zmizí i z nákladů'+(pr?' projektu „'+pr.title+'“':'')+' — to není storno výdaje, jen ztráta záznamu.');
      }
    } else {
      var pc=findDoc('projects',id);
      if(pc && projectHasCost(pc)){ var c=projectCost(pc); lines.push('• Projekt má evidované náklady (plán '+fmtMoney(c.plan,c.cur)+', čerpání '+fmtMoney(c.actual,c.cur)+'). Smazáním se ztratí; úkoly si své částky ponechají.'); }
    }
    return { deps:deps, ns:ns, sub:sub, lines:lines };
  }
  function purgeAsk(kind,id){ STATE.purgeAsk=kind+'|'+id; STATE.purgeBusy=false; render(); }
  function purgeConfirm(kind,id){
    var col=kind==='project'?'projects':'tasks', it=findDoc(col,id); if(!it||STATE.purgeBusy) return;
    var im=purgeImpact(kind,id), ref=refOf(kind,id);
    STATE.purgeBusy=true; render();
    var cleanups=im.deps.map(function(x){ var c=x.kind==='project'?'projects':'tasks'; return saveDoc(c,x.item.id,{dependsOn:depsOf(x.item).filter(function(r){return r!==ref;})},{event:{type:'change',field:'dependsOn',label:'návaznosti',text:'předchůdce „'+it.title+'“ trvale smazán'}}); })
      .concat(im.ns.map(function(p){ return saveDoc('projects',p.id,{nextStepTaskId:'',nextStep:'(další krok smazán: '+it.title+')'},{event:{type:'change',field:'nextStepTaskId',label:'další krok',text:'úkol trvale smazán'}}); }))
      .concat(im.sub.map(function(t){ return saveDoc('tasks',t.id,detachPatch(t),{event:{type:'change',field:'projectId',label:'projekt',from:id,to:'',text:'projekt trvale smazán'}}); }));
    Promise.all(cleanups).then(function(){ return db.collection(col).doc(id).delete(); }).then(function(){ return db.collection('history').doc(id).delete().catch(function(){}); })
      .then(function(){ STATE.purgeBusy=false; STATE.purgeAsk=''; toast('Trvale smazáno.'); render(); })
      .catch(function(e){ STATE.purgeBusy=false; toast('Smazání selhalo ('+(e&&e.code||'chyba')+'); část vazeb už může být odebraná.',true); render(); });
  }

  function attachTaskToProject(pid){
    var sel=document.getElementById('f-addtask'), tid=sel?sel.value:''; if(!tid) return;
    if(lockBlocks(STATE.modal)){ toast('Položku právě upravuje někdo jiný.',true); return; }
    var t=findDoc('tasks',tid), p=findDoc('projects',pid); if(!t||!p) return;
    // úkol nesmí čekat na projekt, do kterého se zařazuje, a projekt nesmí čekat na svůj úkol (V2-03)
    if(depsOf(t).indexOf(refOf('project',pid))>=0){ toast('Úkol čeká na dokončení tohoto projektu — nemůže být zároveň jeho součástí. Nejdřív odeber návaznost.',true); return; }
    if(depsOf(p).indexOf(refOf('task',tid))>=0){ toast('Projekt čeká na tento úkol — úkol nemůže být zároveň jeho součástí.',true); return; }
    // V27-01: stejná ochrana jako v detailu úkolu — přesun s částkami do jiné měny se odmítne
    var curBefore=liveTaskCurrency(t), curAfter=curOf(p.costCurrency);
    if(taskHasCost(t) && curBefore!==curAfter){
      showAlert('<b>„'+esc(t.title)+'“ nelze zařadit — změnil by se význam už zadaných částek.</b> Úkol má peníze v '+esc(curBefore)+', projekt je v '+esc(curAfter)+'. Částky se nepřepočítávají. Do projektu <b>ve stejné měně</b> ho zařadit lze; jinak založ krok v tomto projektu a náklady k němu zapiš znovu vědomě.','err');
      return;
    }
    // útvar úkolu se NEMĚNÍ (R05); měna se uloží výslovně
    saveDoc('tasks',tid,{projectId:pid, costCurrency:curAfter},{event:{type:'change',field:'projectId',label:'projekt',from:t.projectId,to:pid}}).then(function(res){ toast('Úkol zařazen do projektu.'); histWarn(res); }).catch(function(e){ toast('Nepovedlo se ('+(e&&e.code||'chyba')+').',true); });
  }
  // vyjmutí z projektu: úkol si PONECHÁ dosavadní efektivní měnu (V27-01), aby se 100 € nestalo 100 Kč
  function detachPatch(t){ return { projectId:'', costCurrency: liveTaskCurrency(t) }; }
  function detachTaskFromProject(tid){ if(lockBlocks(STATE.modal)){ toast('Položku právě upravuje někdo jiný.',true); return; } var t=findDoc('tasks',tid); if(!t) return; saveDoc('tasks',tid,detachPatch(t),{event:{type:'change',field:'projectId',label:'projekt',from:t.projectId,to:''}}).then(histWarn).catch(function(e){ toast('Nepovedlo se ('+(e&&e.code||'chyba')+').',true); }); }

  // rychlé akce z řádku
  // potvrzení stavu: potvrzuje se ULOŽENÝ záznam; když je dohodnutá kontrola po termínu, nabídne se další datum kontroly (V2-06/07)
  function confirmItem(col,id,nextCheck){
    var it=findDoc(col,id); if(!it) return;
    var patch=confirmPatch(); if(nextCheck!==undefined) patch.nextCheckDate=nextCheck;
    var who = isMine(it) ? '' : ' (potvrzuješ jako ne-vlastník — v historii to bude vidět)';
    return saveDoc(col,id,patch,{event:{type:'confirm',text:(isMine(it)?'':'potvrdil ne-vlastník')+(nextCheck!==undefined?(nextCheck?' · další kontrola '+fmtDate(nextCheck):' · bez další kontroly'):'')}}).then(function(res){ toast('Potvrzeno: stav platí'+who+'.'+(res&&res.historyOk===false?' Historie se nezapsala.':''), res&&res.historyOk===false); }).catch(function(e){ toast('Nepovedlo se ('+(e&&e.code||'chyba')+').',true); });
  }
  function quickConfirm(col,id){
    var it=findDoc(col,id); if(!it) return;
    if(it.nextCheckDate && it.nextCheckDate<=todayStr()){ STATE.inline={kind:'check',id:id,col:col,date:addDays(todayStr(),7)}; render(); setTimeout(function(){ var el=document.getElementById('inl-date'); if(el) el.focus(); },0); return; }

  function inlineSave(){
    var f=STATE.inline; if(!f) return;
    if(f.kind==='privedit'){ privEditSave(); return; }
    var t=findDoc(f.col||'tasks',f.id); if(!t){ STATE.inline=null; render(); return; }
    var text=(document.getElementById('inl-text')||{}).value||''; text=text.trim();
    if(f.kind==='help'){
      if(!text){ f.msg={text:'Napiš, co tě brzdí.',err:true}; render(); return; }
      f.busy=true; saveDoc('tasks',f.id,{waitingReason:text},{event:{type:'blocker',text:text}}).then(function(res){ STATE.inline=null; toast('Překážka nahlášena — objeví se v poradě.'); render(); histWarn(res); }).catch(function(e){ f.busy=false; f.msg={text:'Neuloženo ('+(e&&e.code||'chyba')+').',err:true}; f.text=text; render(); });
    } else if(f.kind==='due'){
      var date=(document.getElementById('inl-date')||{}).value||'';
      if(!date){ f.msg={text:'Vyber nový termín.',err:true}; f.text=text; render(); return; }

      saveDoc('tasks',f.id,{dueDate:date,duePrecision:'day',dueUnconfirmed:false},{event:{type:'due',from:t.dueDate,to:date,text:text}}).then(function(res){ STATE.inline=null; toast('Termín změněn, původní zůstal v historii.'+(res&&res.historyOk===false?' (historie se nezapsala!)':''), res&&res.historyOk===false); render(); }).catch(function(e){ f.msg={text:'Neuloženo ('+(e&&e.code||'chyba')+').',err:true}; f.date=date; f.text=text; render(); });
    } else if(f.kind==='check'){
      var nd=(document.getElementById('inl-date')||{}).value||'';
      confirmItem(f.col||'tasks',f.id,nd).then(function(){ STATE.inline=null; render(); });

            if(!v){ toast('Zadej kurz větší než nula (CZK za 1 €).',true); return; }
            if(v<10||v>40){ toast('Kurz '+fmtRate(v)+' je mimo rozumný rozsah 10–40 CZK/EUR. Zkontroluj zadání.',true); return; }
            if(roundRate(v)!==v) toast('Kurz se zaokrouhlí na 2 desetinná místa: '+fmtRate(v)+'. Počítá se přesně tou hodnotou, která je vidět.');
            saveRate(v);
          })(); return;
        case 'detach-task': detachTaskFromProject(ae.getAttribute('data-id')); return;
        case 'add-decision': addDecision(); return;
        case 'hist-more': if(m){ m.histShow=(m.histShow||60)+100; renderHistoryBox(); } return;
        case 'hist-archive': if(m){ ae.disabled=true; ae.textContent='Načítám…'; loadHistoryArchive(m.data.id).then(function(){ if(STATE.modal===m){ m.histShow=(m.histShow||60)+100000; renderHistoryBox(); var hh=STATE.history[m.data.id]; if(hh&&!hh.archiveLoaded) toast('Archiv historie není úplný ('+((hh.archiveFailed||[]).length+(hh.archiveMissing||[]).length)+' bloků chybí nebo se nenačetly).', true); } }); } return;
        case 'retry-history': if(m){ ae.disabled=true; ae.textContent='Zapisuji…'; retryHistory(m.data.id).then(function(){ toast('Historie doplněna.'); },function(e){ toast('Historie se stále nezapsala ('+(e&&e.code||'chyba')+').',true); }).then(function(){ if(STATE.modal===m) renderHistoryBox(); }); } return;
        case 'attn-toggle': STATE.attnAll=!STATE.attnAll; render(); return;
        case 'present-toggle': STATE.present=!STATE.present; render(); return;
        case 'task-move': ev.stopPropagation(); moveTask(ae.getAttribute('data-id'), parseInt(ae.getAttribute('data-dir'),10)); return;
      }
    }
    var openEl=t.closest('[data-open]');
    if(openEl){ var kind=openEl.getAttribute('data-open'), id=openEl.getAttribute('data-id'); if(kind==='project') openEditProject(id); else if(kind==='task') openEditTask(id); return; }
  });

  document.addEventListener('input', function(ev){
    var t=ev.target;
    if(t.id&&t.id.indexOf('qa-date-')===0){ var sf=t.id.replace('qa-date-',''); STATE.qaDue[sf]=t.value; STATE.qaMsg[sf]=null; return; }
    if(t.id&&t.id.indexOf('qa-start-')===0){ var sfs=t.id.replace('qa-start-',''); STATE.qaStart[sfs]=t.value; STATE.qaMsg[sfs]=null; return; }
    if(t.classList&&t.classList.contains('qa-input')){ STATE.qaText[t.id.replace('qa-','')]=t.value; return; }
    if(t.id==='search-input'){ withFocusPreserved(function(){ STATE.search=t.value; render(); }); return; }
    if(t.id==='f-owner-q'){ ownerSearch(t.value); return; }
    if(t.id==='f-ch-team-add'){ if(/[,;]$/.test(t.value)) teamAdd(t.value); return; }
    if(t.id==='pair-q'){ pairSearch(t.value); return; }
    var ibo=t.getAttribute&&(t.getAttribute('data-ib-owner')||t.getAttribute('data-ib-due')||t.getAttribute('data-ib-dept'));
    if(ibo){ var dd=STATE.ibDraft[ibo]=STATE.ibDraft[ibo]||{}; if(t.hasAttribute('data-ib-owner')) dd.owner=t.value; if(t.hasAttribute('data-ib-due')) dd.due=t.value; if(t.hasAttribute('data-ib-dept')) dd.dept=t.value; return; }
    if(t.id==='dep-q'){ depSearch(t.value); return; }
    if(t.id==='f-nexttask'){ var ns=document.getElementById('f-nextstep'); if(ns) ns.style.display=t.value?'none':''; }
    // rychlé zadání uvnitř detailu není změnou formuláře — nesmí dělat detail „rozpracovaný“
    if(STATE.modal && t.closest('.modal-body') && !t.classList.contains('qa-input')){ STATE.modal.dirty=true; if(!t.closest('#f-status-alert')) STATE.modal.saveOpts=null; }   // změna pole = nový ukládací pokus, staré odpovědi dialogů neplatí
  });
  document.addEventListener('focusout', function(ev){ if(ev.target&&ev.target.id==='f-ch-team-add'&&ev.target.value.trim()) teamAdd(ev.target.value); });
  document.addEventListener('focusin', function(ev){ if(ev.target.id==='f-owner-q') ownerSearch(ev.target.value); if(ev.target.id==='dep-q') depSearch(ev.target.value); });
  document.addEventListener('change', function(ev){
    var t=ev.target;
    if(t.id==='att-file'){ var f=t.files&&t.files[0]; t.value=''; if(f) uploadAttachment(f); return; }
    if(t.id==='f-ch-team-add'){ if(t.value.indexOf('@')>0) teamAdd(t.value); return; }   // výběr z našeptávače (datalist) = hned přidat
    // změna projektu v detailu úkolu: hned ukázat, v jaké měně se částky vedou (V28-01)
    if(t.id==='f-project' && STATE.modal && STATE.modal.type==='task'){ taskProjectChanged(t.value); return; }
    if(t.id&&t.id.indexOf('qa-date-')===0){ var sfc=t.id.replace('qa-date-',''); STATE.qaDue[sfc]=t.value; STATE.qaMsg[sfc]=null; return; }
    if(t.id&&t.id.indexOf('qa-start-')===0){ var sfc2=t.id.replace('qa-start-',''); STATE.qaStart[sfc2]=t.value; STATE.qaMsg[sfc2]=null; return; }
    if(t.id&&t.id.indexOf('qa-dept-')===0){ STATE.qaDept[t.id.replace('qa-dept-','')]=t.value; return; }
    if(t.hasAttribute&&t.hasAttribute('data-ib-dept')){ var idd=t.getAttribute('data-ib-dept'); STATE.ibDraft[idd]=STATE.ibDraft[idd]||{}; STATE.ibDraft[idd].dept=t.value; return; }
    var pfSel=t.closest('[data-pf]'); if(pfSel){ STATE.pf[pfSel.getAttribute('data-pf')]=pfSel.value; render(); return; }
    if(t.hasAttribute&&t.hasAttribute('data-ceo-done')){ STATE.ceoShowDone=t.checked; render(); return; }
    if(t.hasAttribute&&t.hasAttribute('data-ceo-dept')){ STATE.ceoDept=t.value; render(); return; }
    if(t.hasAttribute&&t.hasAttribute('data-ceo-owner')){ STATE.ceoOwner=t.value; render(); return; }
    var pt=t.closest('input[type=checkbox][data-priv-toggle]'); if(pt){ privToggle(pt.getAttribute('data-priv-toggle'), pt.checked); return; }
    var todo=t.closest('input[type=checkbox][data-toggle-task]'); if(todo){ toggleTaskDone(todo.getAttribute('data-toggle-task'), todo.checked); return; }
    var cb=t.closest('input[type=checkbox][data-project-id]'); if(cb){ toggleMilestone(cb.getAttribute('data-project-id'), parseInt(cb.getAttribute('data-ms-index'),10)); return; }
  });
  // kde začal stisk myši: klik na pozadí zavírá detail, jen když začal i skončil na pozadí (výběr textu tažením ven z okna ne)
  var downOnBg=false;
  document.addEventListener('mousedown', function(ev){ downOnBg = !!(ev.target && ev.target.classList && ev.target.classList.contains('modal-overlay')); }, true);
  document.addEventListener('keydown', function(ev){
    if(ev.key==='Escape' && STATE.modal){ closeModal(false); return; }
    if(ev.key!=='Enter') return; var el=ev.target;
    if(el&&el.classList&&el.classList.contains('qa-input')){ ev.preventDefault(); qaSubmit(el.id.replace('qa-','')); return; }
    if(el&&el.id&&el.id.indexOf('qa-date-')===0){ ev.preventDefault(); STATE.qaDue[el.id.replace('qa-date-','')]=el.value; qaSubmit(el.id.replace('qa-date-','')); return; }
    if(el&&el.id&&el.id.indexOf('qa-start-')===0){ ev.preventDefault(); STATE.qaStart[el.id.replace('qa-start-','')]=el.value; qaSubmit(el.id.replace('qa-start-','')); return; }
    if(el&&el.id==='f-ch-team-add'){ ev.preventDefault(); teamAdd(el.value); return; }
    if(el&&el.id==='inl-text'){ ev.preventDefault(); inlineSave(); return; }
    if(el&&el.id==='f-owner-q'){ ev.preventDefault(); var v=el.value.trim(); if(v.indexOf('@')>0){ var prof=PROFILE_BY_EMAIL[normKey(v)]; setOwner(v, prof?prof.id:''); } return; }
    if(el&&el.id==='f-decision-text'){ ev.preventDefault(); addDecision(); return; }
  });
  // drag & drop v kanbanu — se stejnou blokací jako šipky
  document.addEventListener('dragstart', function(ev){ var c=ev.target.closest('.task-card'); if(!c) return; STATE.dragTaskId=c.getAttribute('data-task-id'); ev.dataTransfer.effectAllowed='move'; });
  document.addEventListener('dragover', function(ev){ var d=ev.target.closest('.kanban-drop'); if(!d) return; ev.preventDefault(); d.classList.add('drag-over'); });
  document.addEventListener('dragleave', function(ev){ var d=ev.target.closest('.kanban-drop'); if(d) d.classList.remove('drag-over'); });
  document.addEventListener('drop', function(ev){
    var d=ev.target.closest('.kanban-drop'); if(!d) return; ev.preventDefault(); d.classList.remove('drag-over');
    var col=d.getAttribute('data-col'), id=STATE.dragTaskId; STATE.dragTaskId=null; if(!id||!db) return;
    var t=findDoc('tasks',id); if(!t||t.status===col) return; var tb=transitionBlock(t,col); if(tb){ toast(tb,true); return; }
    saveDoc('tasks',id,Object.assign({status:col},col==='done'?confirmPatch():{})).then(histWarn).catch(function(e){ toast('Nepovedlo se ('+(e&&e.code||'chyba')+').',true); });
  });
  document.addEventListener('click', function(ev){ var menu=document.getElementById('owner-menu'); if(menu && !ev.target.closest('.owner-pick')) menu.style.display='none'; var pk=document.getElementById('dep-picker'); if(pk && !ev.target.closest('.dep-box')) pk.style.display='none'; });

  render();
  initDb();
})();
</script>
