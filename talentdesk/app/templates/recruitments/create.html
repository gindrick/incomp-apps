{% extends "base.html" %}
{% block title %}New Recruitment — TalentDesk{% endblock %}
{% block content %}
<div class="max-w-2xl">
  <div class="flex items-center gap-3 mb-8">
    <a href="{{ prefix }}/recruitments" class="text-gray-500 hover:text-gray-300 text-sm">← Recruitments</a>
  </div>
  <h1 class="text-2xl font-bold text-white mb-6">New Recruitment Campaign</h1>
  <form method="post" action="{{ prefix }}/recruitments/new" class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Campaign Name</label>
      <input name="title" type="text" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" placeholder="Senior Developer – Prague" />
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-300 mb-1">Job Position (JD)</label>
      <select name="jd_id" required class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white focus:border-sky-500 focus:outline-none">
        <option value="">-- Select position --</option>
        {% for jd in jds %}
        <option value="{{ jd.id }}">{{ jd.title }}{% if jd.department %} ({{ jd.department }}){% endif %}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-white font-semibold px-6 py-2.5 rounded-lg transition-colors">Create</button>
      <a href="{{ prefix }}/recruitments" class="text-gray-400 hover:text-gray-200 px-4 py-2.5 transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
