{% extends "base.html" %}
{% block title %}{% if jd %}Edit Position{% else %}New Position{% endif %} — TalentDesk{% endblock %}
{% block content %}
<div class="max-w-3xl">
  <div class="flex items-center gap-3 mb-6">
    <a href="{{ prefix }}/job-descriptions" class="text-gray-500 hover:text-gray-300 text-sm">← Positions</a>
  </div>
  <h1 class="text-2xl font-bold text-white mb-6">{% if jd %}Edit Position{% else %}New Job Position{% endif %}</h1>
  <form method="post" action="{% if jd %}{{ prefix }}/job-descriptions/{{ jd.id }}{% else %}{{ prefix }}/job-descriptions/new{% endif %}" class="bg-gray-900 border border-gray-800 rounded-xl p-6 space-y-5">
    <div class="grid grid-cols-2 gap-4">
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-300 mb-1">Position Name *</label>
        <input name="title" type="text" required value="{% if jd %}{{ jd.title }}{% endif %}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Department</label>
        <input name="department" type="text" value="{% if jd %}{{ jd.department or '' }}{% endif %}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Currency</label>
        <input name="currency" type="text" value="{% if jd %}{{ jd.currency }}{% else %}CZK{% endif %}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Salary From</label>
        <input name="salary_min" type="number" value="{% if jd and jd.salary_min %}{{ jd.salary_min | int }}{% endif %}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-300 mb-1">Salary To</label>
        <input name="salary_max" type="number" value="{% if jd and jd.salary_max %}{{ jd.salary_max | int }}{% endif %}" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none" />
      </div>
      <div class="col-span-2">
        <label class="block text-sm font-medium text-gray-300 mb-1">Position Description (JD) *</label>
        <textarea name="content" required rows="12" class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-2.5 text-white placeholder-gray-500 focus:border-sky-500 focus:outline-none font-mono text-sm">{% if jd %}{{ jd.content }}{% endif %}</textarea>
      </div>
    </div>
    <div class="flex gap-3 pt-2">
      <button type="submit" class="bg-sky-500 hover:bg-sky-400 text-white font-semibold px-6 py-2.5 rounded-lg transition-colors">Save</button>
      <a href="{{ prefix }}/job-descriptions" class="text-gray-400 hover:text-gray-200 px-4 py-2.5 transition-colors">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
