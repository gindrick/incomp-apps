<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pepa „Messi" Kopačka Feeder Tool</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23111827'/%3E%3Cpath d='M14 18h24v5H14zM14 27h18v5H14zM14 36h12v5H14z' fill='%2334d399'/%3E%3Cpath d='M44 30v14M38 38l6 6 6-6' stroke='%2334d399' stroke-width='3.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', system-ui, sans-serif;
      background: #0f172a; color: #e2e8f0; min-height: 100vh;
    }
    nav {
      background: #111827; border-bottom: 1px solid rgba(255,255,255,0.08);
      padding: 0.875rem 1.5rem; display: flex; align-items: center; justify-content: space-between;
    }
    .nav-brand { display: flex; align-items: center; gap: 0.6rem; font-size: 15px; font-weight: 600; color: #34d399; }
    .nav-brand svg { flex-shrink: 0; }
    .nav-user { font-size: 13px; color: rgba(255,255,255,0.4); display: flex; align-items: center; gap: 1rem; }
    .nav-user a { color: rgba(255,255,255,0.3); text-decoration: none; transition: color 0.15s; }
    .nav-user a:hover { color: #fca5a5; }

    main { max-width: 640px; margin: 4rem auto; padding: 0 1.5rem; }

    .card {
      background: #111827; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px; padding: 2.5rem;
      box-shadow: 0 24px 60px rgba(0,0,0,0.4);
    }
    .card-title { font-size: 1.2rem; font-weight: 600; color: #f8fafc; margin-bottom: 0.4rem; }
    .card-sub { font-size: 13px; color: rgba(255,255,255,0.35); margin-bottom: 2rem; }

    label { display: block; font-size: 12px; font-weight: 500; color: rgba(255,255,255,0.45); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 0.5rem; }
    .input-row { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    input[type="url"] {
      flex: 1; padding: 0.75rem 1rem; border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.04);
      color: #f1f5f9; font-family: 'DM Sans', sans-serif; font-size: 14px;
      transition: border-color 0.15s, background 0.15s; outline: none;
    }
    input[type="url"]:focus { border-color: rgba(52,211,153,0.5); background: rgba(52,211,153,0.05); }
    input[type="url"]::placeholder { color: rgba(255,255,255,0.2); }

    .btn {
      padding: 0.75rem 1.25rem; border-radius: 10px; border: 0;
      font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600;
      cursor: pointer; transition: background 0.15s, transform 0.1s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    .btn-primary { background: #34d399; color: #022c22; }
    .btn-primary:hover:not(:disabled) { background: #6ee7b7; }
    .btn-run { background: #3b82f6; color: #fff; width: 100%; padding: 0.85rem; }
    .btn-run:hover:not(:disabled) { background: #60a5fa; }
    .btn-download { background: #22c55e; color: #052e16; width: 100%; padding: 0.85rem; font-size: 15px; }
    .btn-download:hover { background: #4ade80; }
    .btn-reset { background: transparent; color: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.12); width: 100%; padding: 0.75rem; margin-top: 0.75rem; font-size: 13px; }
    .btn-reset:hover { background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6); border-color: rgba(255,255,255,0.2); }

    .status-box {
      display: none; align-items: flex-start; gap: 0.6rem;
      padding: 0.85rem 1rem; border-radius: 10px; font-size: 13px; line-height: 1.5;
      margin-bottom: 1.25rem;
    }
    .status-box.visible { display: flex; }
    .status-box.ok  { background: rgba(52,211,153,0.1);  border: 1px solid rgba(52,211,153,0.3);  color: #6ee7b7; }
    .status-box.err { background: rgba(239,68,68,0.12);  border: 1px solid rgba(239,68,68,0.3);   color: #fca5a5; }
    .status-box.info{ background: rgba(59,130,246,0.1);  border: 1px solid rgba(59,130,246,0.3);  color: #93c5fd; }

    .spinner {
      display: inline-block; width: 16px; height: 16px; flex-shrink: 0; margin-top: 1px;
      border: 2px solid rgba(255,255,255,0.15); border-top-color: #93c5fd;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .step { display: none; }
    .step.visible { display: block; }
    .divider { height: 1px; background: rgba(255,255,255,0.06); margin: 1.5rem 0; }
  </style>
</head>
<body>
  <nav>
    <div class="nav-brand">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
        <polyline points="14 2 14 8 20 8"/>
        <line x1="12" y1="18" x2="12" y2="12"/>
        <line x1="9" y1="15" x2="12" y2="18"/>
        <line x1="15" y1="15" x2="12" y2="18"/>
      </svg>
      Pepa „Messi" Kopačka Feeder Tool
    </div>
    <div class="nav-user">
      <span>{{ user }}</span>
      <a href="{{ prefix }}/logout">Odhlásit</a>
    </div>
  </nav>

  <main>
    <div class="card">
      <p class="card-title">Stažení XML feedu</p>
      <p class="card-sub">Zadejte URL zdroje, ověřte dostupnost a stáhněte soubor.</p>

      <!-- Krok 1: URL + validace -->
      <label>URL zdroje</label>
      <div class="input-row">
        <input type="url" id="url-input" placeholder="https://example.com/feed.xml" />
        <button class="btn btn-primary" id="btn-validate">Ověřit</button>
      </div>

      <div class="status-box" id="validate-status">
        <svg id="validate-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <span id="validate-msg"></span>
      </div>

      <!-- Krok 2: Spuštění skriptu -->
      <div class="step" id="step-run">
        <div class="divider"></div>
        <button class="btn btn-run" id="btn-run">Spustit stahování</button>
      </div>

      <div class="status-box" id="run-status">
        <span id="run-icon"></span>
        <span id="run-msg"></span>
      </div>

      <!-- Krok 3: Stažení + reset -->
      <div class="step" id="step-download">
        <div class="divider"></div>
        <a id="download-link" href="#" class="btn btn-download" style="display:block;text-align:center;text-decoration:none;">
          ⬇ Stáhnout soubor
        </a>
        <button class="btn btn-reset" id="btn-reset">↩ Zadat novou URL</button>
      </div>
    </div>
  </main>

  <script>
    const PREFIX = "{{ prefix }}";
    const urlInput    = document.getElementById("url-input");
    const btnValidate = document.getElementById("btn-validate");
    const validateStatus = document.getElementById("validate-status");
    const validateMsg    = document.getElementById("validate-msg");
    const stepRun     = document.getElementById("step-run");
    const btnRun      = document.getElementById("btn-run");
    const runStatus   = document.getElementById("run-status");
    const runIcon     = document.getElementById("run-icon");
    const runMsg      = document.getElementById("run-msg");
    const stepDownload = document.getElementById("step-download");
    const downloadLink = document.getElementById("download-link");
    const btnReset    = document.getElementById("btn-reset");

    function resetFlow() {
      validateStatus.className = "status-box";
      stepRun.className        = "step";
      runStatus.className      = "status-box";
      stepDownload.className   = "step";
    }

    function fullReset() {
      urlInput.value = "";
      resetFlow();
      urlInput.focus();
    }

    function setValidateResult(ok, msg) {
      validateStatus.className = `status-box visible ${ok ? "ok" : "err"}`;
      validateMsg.textContent  = msg;
      const icon = document.getElementById("validate-icon");
      icon.innerHTML = ok
        ? '<polyline points="20 6 9 17 4 12"/>'
        : '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>';
      stepRun.className = ok ? "step visible" : "step";
    }

    btnValidate.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      if (!url) {
        validateStatus.className = "status-box visible err";
        validateMsg.textContent  = "Zadejte URL.";
        return;
      }
      resetFlow();
      btnValidate.disabled    = true;
      btnValidate.textContent = "Ověřuji…";
      try {
        const res  = await fetch(`${PREFIX}/api/validate`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        setValidateResult(data.valid, data.message);
      } catch (e) {
        setValidateResult(false, "Chyba při ověřování: " + e.message);
      } finally {
        btnValidate.disabled    = false;
        btnValidate.textContent = "Ověřit";
      }
    });

    urlInput.addEventListener("input", resetFlow);
    urlInput.addEventListener("keydown", (e) => { if (e.key === "Enter") btnValidate.click(); });

    btnRun.addEventListener("click", async () => {
      const url = urlInput.value.trim();
      btnRun.disabled = true;
      runStatus.className    = "status-box visible info";
      runIcon.innerHTML      = '<span class="spinner"></span>';
      runMsg.textContent     = "Stahování probíhá…";
      stepDownload.className = "step";
      try {
        const res  = await fetch(`${PREFIX}/api/run`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ url }),
        });
        const data = await res.json();
        if (data.success) {
          runStatus.className    = "status-box visible ok";
          runIcon.innerHTML      = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><polyline points="20 6 9 17 4 12"/></svg>';
          runMsg.textContent     = "Soubor byl úspěšně stažen.";
          downloadLink.href      = `${PREFIX}/download/${encodeURIComponent(data.file)}`;
          stepDownload.className = "step visible";
        } else {
          runStatus.className = "status-box visible err";
          runIcon.innerHTML   = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>';
          runMsg.textContent  = data.error || "Neznámá chyba.";
        }
      } catch (e) {
        runStatus.className = "status-box visible err";
        runIcon.innerHTML   = "";
        runMsg.textContent  = "Chyba při spouštění: " + e.message;
      } finally {
        btnRun.disabled = false;
      }
    });

    btnReset.addEventListener("click", fullReset);
  </script>
</body>
</html>
